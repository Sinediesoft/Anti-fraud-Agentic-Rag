# 誰管哪一塊（說明書 S1 第 3 步）。CODEOWNERS 與 tools/check_ownership.py 都讀這份。
#
# 五個人的 GitHub 帳號已填齊。動這份時記得同步更新 .github/CODEOWNERS ——
# 兩份不一致的話，CODEOWNERS 的自動指派不會生效。
#
# 「負責組合」的來源一律是各自 pack.yaml 的 platform / tactic ——
# 這份只是彙總，兩邊不一致時以 pack.yaml 為準（那是程式真正讀的那份）。
# 例外：D 還沒有 pack.yaml（d_tbd/ 目前只有 README.md），那一列的值出自
# PR #39 的宣告。
#
# 先填的人等於先佔位。撞題的話以這份為準來談，不要各自默默做到第五週
# 才發現兩個人在切同一批語料。
#
# 2026-09-22 對齊：A、C 從各自 pack.yaml 填入；D（PR #39）、E（PR #41）
# 合併後也填上了。
# TODO(S1)：B 的題目還沒宣告 —— 五個人裡只剩這一欄是空的。
#
# os 欄位不是裝飾：本隊是 1 台 macOS + 4 台 Windows，S3 選模型要看最低配那台，
# S11 選 OCR 與 S16 指定展示機都依賴這份資料。
# 跨平台差異見 docs/說明書補充-跨平台差異.md

repo: Anti-fraud-Agentic-Rag      # GitHub 上的儲存庫名。跟 pyproject.toml 的套件名
                                  # anti-fraud-copilot 是兩回事，那個動了要重生 uv.lock
owner_org: Sinediesoft            # 開儲存庫的那個人

members:
  - code: A
    github: Sinediesoft      # ← 這是你
    name: Sinediesoft
    os: macOS
    gpu: Apple M5 (10核) / 16GB 統一記憶體
    module_dir: packages/modules/a_tbd
    platform: LINE                # 2026-09-20 決定，見 a_tbd/pack.yaml
    tactic: 假投資                # 全量語料交集 17,764 筆（門檻 2,000）
    plan: free                    # 說明書：件數最大的一組走免費版開放
  - code: B
    github: shin5shin
    name: shin5shin
    os: Windows
    gpu: GTX 1650 / 4GB
    module_dir: packages/modules/b_tbd
    platform: TODO-平台           # TODO(S1)：尚未宣告，b_tbd/ 目前只有 README.md
    tactic: TODO-詐騙手法
    plan: paid
  - code: C
    github: a24209422
    name: a24209422
    os: Windows
    gpu: GTX 1650 / 4GB
    module_dir: packages/modules/c_tbd
    platform: Facebook            # 見 c_tbd/pack.yaml
    tactic: 投資詐騙              # labels_canon 為「假投資」，與 A 同手法、靠平台分開
    plan: paid
  - code: D
    github: door410
    name: door410
    os: Windows
    gpu: GTX 1050 Ti / 4GB
    module_dir: packages/modules/d_tbd
    # 受害者是「正在進行一筆交易、被中途打斷」的買家或賣家（雙向都收）。
    # 與隔壁的界線：網路購物的「東西沒寄到」歸別人，我只收「被引導去做金流動作」的；
    # 寄提款卡給對方的歸 E。詳見 packages/modules/d_tbd/README.md
    platform: 超商店到店物流
    tactic: 假冒物流平台客服（實名認證話術）
    plan: paid
  - code: E
    github: c85016921920-design
    name: c85016921920-design
    os: Windows
    gpu: RTX 5070 Ti / 16GB
    module_dir: packages/modules/e_tbd
    # PR #41 把題目從「求職平台 × 人頭帳戶」改成這組。平台用「起點」定義：
    # Threads 案例有 57.2% 會導流到 LINE，但 99.5% 是 Threads 先出現，所以
    # 整條算 E；起點在 LINE 的（例如群組假投資）歸 A。
    platform: Threads
    tactic: 網路購物詐騙
    plan: paid

# S16/S22 的展示機：那台要裝得起全部五個模組的依賴，W5 結束前先試裝一次
# 建議 E（RTX 5070 Ti / 16GB，全隊最快），但這要 S3 站立會決定
demo_machine: TODO-S3   # 填成員代號，例：E

# 全隊顯卡天花板 4GB（B/C/D），所以地端模型只能用 3B 級
# 詳見 docs/model-lock.md 的「模型尺寸決策」
vram_floor_gb: 4

# 這些路徑全員共管，W1–W2 做完就凍結（規矩三）
shared_paths:
  - packages/contracts/   # W1 末凍結，改動要全員同意
  - packages/shared/      # W2 末凍結，之後只修 bug
  - app/                  # W2 末凍結，W6 合併週才會再動
  - packages/modules/_template/
  - Makefile
  - pyproject.toml
  - uv.lock
