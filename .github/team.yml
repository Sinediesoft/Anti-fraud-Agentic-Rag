# S16/S22 的展示機：那台要裝得起全部五個模組的依賴，W5 結束前先試裝一次
# 建議 E（RTX 5070 Ti / 16GB，全隊最快），但這要 S3 站立會決定
demo_machine: TODO-S3   # 填成員代號，例：E

# 全隊顯卡天花板 4GB（B/C/D），所以地端模型只能用 3B 級
# 詳見 docs/model-lock.md 的「模型尺寸決策」
vram_floor_gb: 4

# 這些路徑全員共管，W1–W2 做完就凍結（規矩三）
shared_paths:
  - packages/contracts/   # W1 末凍結，改動要全員同意
  - packages/shared/      # W2 末凍結，之後只修 bug
  - app/                  # W2 末凍結，W6 合併週才會再動
  - packages/modules/_template/
  - Makefile
  - pyproject.toml
  - uv.lock
