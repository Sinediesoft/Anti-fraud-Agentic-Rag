# 誰管哪一塊（說明書 S1 第 3 步）。CODEOWNERS 與 tools/check_ownership.py 都讀這份。
#
# 五個人的 GitHub 帳號已填齊。動這份時記得同步更新 .github/CODEOWNERS ——
# 兩份不一致的話，CODEOWNERS 的自動指派不會生效。
#
# TODO(S1)：還缺「負責組合」—— D 已填，A／B／C／E 的 platform × tactic 還是 TODO。
#           題目沒定，那四個模組就開不了工。
#
#           先填的人等於先佔位。撞題的話以這份為準來談，不要各自默默做到第五週
#           才發現兩個人在切同一批語料。
#
# os 欄位不是裝飾：本隊是 1 台 macOS + 4 台 Windows，S3 選模型要看最低配那台，
# S11 選 OCR 與 S16 指定展示機都依賴這份資料。
# 跨平台差異見 docs/說明書補充-跨平台差異.md

repo: Anti-fraud-Agentic-Rag      # GitHub 上的儲存庫名。跟 pyproject.toml 的套件名
                                  # anti-fraud-copilot 是兩回事，那個動了要重生 uv.lock
owner_org: Sinediesoft            # 開儲存庫的那個人

members:
  - code: A
    github: Sinediesoft      # ← 這是你
    name: Sinediesoft
    os: macOS
    gpu: Apple M5 (10核) / 16GB 統一記憶體
    module_dir: packages/modules/a_tbd
    platform: TODO-平台           # TODO：平台 × 詐騙手法尚未決定
    tactic: TODO-詐騙手法
    plan: free                    # 說明書：件數最大的一組走免費版開放
  - code: B
    github: shin5shin
    name: shin5shin
    os: Windows
    gpu: GTX 1650 / 4GB
    module_dir: packages/modules/b_tbd
    platform: TODO-平台
    tactic: TODO-詐騙手法
    plan: paid
  - code: C
    github: a24209422
    name: a24209422
    os: Windows
    gpu: GTX 1650 / 4GB
    module_dir: packages/modules/c_tbd
    platform: TODO-平台
    tactic: TODO-詐騙手法
    plan: paid
  - code: D
    github: door410
    name: door410
    os: Windows
    gpu: GTX 1050 Ti / 4GB
    module_dir: packages/modules/d_tbd
    # 受害者是「正在進行一筆交易、被中途打斷」的買家或賣家（雙向都收）。
    # 與隔壁的界線：網路購物的「東西沒寄到」歸別人，我只收「被引導去做金流動作」的；
    # 寄提款卡給對方的歸 E。詳見 packages/modules/d_tbd/README.md
