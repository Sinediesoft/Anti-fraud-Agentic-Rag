# 送出修改前的自動檢查（說明書 S2）。裝法：uv run pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]   # 大檔案不准進版控（§1.6）

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      # 規矩一與規矩二的執法者：模組資料夾不准自己呼叫模型、連網，或 import 別人的模組
      - id: boundary-check
        name: 模組越界檢查
        # 走 uv run，不要用系統的 python：Windows 上系統的 python 可能是 3.13
        # （專案要 >=3.11,<3.12），macOS 上常常根本沒有 python、只有 python3。
        # 原本那樣寫，兩邊都是碰運氣。
        entry: uv run python tools/check_boundaries.py
        language: system
        pass_filenames: false
        always_run: true
