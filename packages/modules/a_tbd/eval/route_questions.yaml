# 20 題考題 — 模組 A（LINE × 假投資）。說明書 S12 第 4 點、S14 第 3 點。
#
# 每題寫成「受害者會怎麼講這件事」的白話查詢，至少 8 題完全不含專有名詞。
#
# 出題太簡單會讓分數虛高。整個專案的起點就是
# 「群組裡的老師叫我先入金才能出金」在官方站台 0 筆命中 ——
# 你的題目要逼近那個場景。
#
# 欄位：text（白話查詢）／gold_case_ids（正確答案的案例編號）／plain（是否不含專有名詞）
#
# ── 這 20 題怎麼來的（2026-09-22）─────────────────────────────
# 不是憑空編的。做法是先在自己那 17,764 筆語料裡依情境分層取樣，讀真實
# 報案敘述的用詞，再改寫成「使用者會對聊天視窗打的話」。
# 六個情境的實際筆數：
#   出金／提領受阻  9,148    群組帶單      8,779
#   虛擬貨幣       11,268    面交          5,924
#   股票／飆股      3,220    加碼／保證金   2,287
#
# 一個讀語料才看得到的落差，出題時刻意保留：
# **真實報案敘述幾乎都寫明平台名，使用者打字時不會。** 語料是筆錄體
#（「我於【Facebook廣告】得知投資訊息…慫恿至【假投資網站】」），而會來問
# 的人只會說「群組裡的老師叫我先入金才能出金」。照語料的寫法出題會讓分數
# 虛高 —— 所以 plain 那 10 題是刻意寫成口語、不含任何平台名的。
#
# ── gold_case_ids 為什麼全是空的 ──────────────────────────────
# TODO(S10)：要等自己那 60 筆標準答案標完才有編號可填。
# 這不擋 S16 第 3 項 —— 那一項只看 can_handle 的分數，不看檢索答案。
# 但 Recall@5 要等這裡填上才量得出來。
#
# ── 這份題目當過量尺，兩次量測都記在這裡 ──────────────────────
# 出題時刻意照規則寫、不遷就當時的機制，就是為了量出問題。
#
# can_handle() = keyword_score × 平台係數，keyword_score 是飽和函式
# hits/(hits+2)。原本平台判定只有兩態（有我的平台詞 ×1.3，其餘一律 ×0.6）：
#
#   命中   底分     ×1.3 有平台詞   ×0.6 無平台詞
#     2   0.5000   0.6500          0.3000
#     3   0.6000   0.7800          0.3600
#     5   0.7143   0.9286          0.4286
#    10   0.8333   —               0.5000  ← 要 10 個命中才碰到 route_min
#
# 一句口語塞不進 10 個手法詞，所以下面 10 題 plain 的全數落在 0.20–0.40。
#
#   2026-09-22 基準（兩態）：10/20  —— plain 0/10、含平台詞 10/10
#   2026-09-22 三態之後：    19/20  —— plain 9/10、含平台詞 10/10
#
# 中間只改了一件事：把「沒提任何平台」從 ×0.6 改成中性 ×1.0（提到別人的
# 平台照舊 ×0.6）。題目一個字都沒動 —— 改機制卻順手改題目，等於自己驗
# 自己，量不出任何東西。
#
# 🔴 這個 19/20 沒有安全邊際：plain 那 10 題裡有 5 題剛好落在 0.5000，
#    等於 route_min（比較是 >=，所以過）。門檻往上動一格就會一起掉下去。
#    調 route_min 或動 keyword_score 的分母之前，先重跑這份。
#
# 旁證：PR #41（模組 E）獨立量到同一件事 ——「路由考題與檢索評估集不能
# 共用，檢索評估集刻意避開專有名詞，而 can_handle 正是靠那些詞區分類別」，
# 他們混用時得到 0/20。兩個人從不同方向撞到同一面牆，所以範本的出題規則
# 要不要拆成兩份檔案（路由題／檢索題），值得拿到全隊層級討論。
# ──────────────────────────────────────────────────────────────

# ═══ 不含專有名詞的 10 題（規則要求至少 8 題）═══════════════════
# 全部沒有平台名，是真實使用者的打字方式。

- text: 群組裡的老師叫我先入金才能出金
  gold_case_ids: []
  plain: true            # 本專案的起點例句，官方站台逐字比對 0 筆命中

- text: 他說跟著他操作保證獲利，我投了錢現在提領不出來
  gold_case_ids: []
  plain: true

- text: 有人拉我進一個投資群組，裡面每天有人曬獲利的截圖
  gold_case_ids: []
  plain: true

- text: 對方說穩賺不賠，我把錢匯過去買虛擬貨幣，現在網站關了
  gold_case_ids: []
  plain: true

- text: 對方約我面交現金去投資，說獲利很好
  gold_case_ids: []
  plain: true

- text: 網路上認識的人教我買股票，一開始有賺錢，後來就出不了金
  gold_case_ids: []
  plain: true

- text: app 上顯示我獲利兩百多萬，但客服說要先繳保證金才能提領
  gold_case_ids: []
  plain: true

- text: 我在群組裡跟著老師下單，帳面上有獲利但錢拿不回來
  gold_case_ids: []
  plain: true

- text: 對方說小額投資就能獲利，後來平台說要繳手續費才能出金
  gold_case_ids: []
  plain: true

- text: 我想把投資的錢領回來，對方一直叫我再加碼
  gold_case_ids: []
  plain: true            # 刻意留的難題：受害者只講「領回來」「加碼」，
                         # 兩個詞都不在 route_terms 裡。這題大概會掛，
                         # 留著是為了讓詞表的缺口看得見（S18 補詞時的依據）

# ═══ 含平台詞的 10 題 ═══════════════════════════════════════════
# LINE 三種大小寫都出現，因為語料裡三種寫法都有
#（LINE 1,294 次／line 139 次／Line 122 次）。

- text: 我在 LINE 上被拉進投資群組，說穩賺不賠
  gold_case_ids: []
  plain: false

- text: LINE 群組的老師叫我下載 APP 投資，現在出金失敗
  gold_case_ids: []
  plain: false

- text: 在 Line 上認識的人教我買股票，說跟著操作能賺錢
  gold_case_ids: []
  plain: false

- text: 對方給我 LINE ID，把我拉進投資群組要我面交現金
  gold_case_ids: []
  plain: false

- text: 我在 line 群組裡投資虛擬貨幣，現在提領不出來
  gold_case_ids: []
  plain: false

- text: LINE 上自稱投資顧問的人叫我繳保證金才能出金
  gold_case_ids: []
  plain: false

- text: LINE 上有人加我好友聊投資，說跟著操作穩賺不賠
  gold_case_ids: []
  plain: false

- text: 我加了 LINE 投資群組，入金之後就提領不出來
  gold_case_ids: []
  plain: false

- text: LINE 客服說要再匯一筆錢才能把投資獲利出金
