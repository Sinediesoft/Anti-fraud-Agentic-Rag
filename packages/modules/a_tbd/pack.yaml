# ═══════════════════════════════════════════════════════════════
#  模組 A — LINE × 假投資（2026-09-20 決定，2026-09-22 更新這份清單）
#
#  已經做完的：
#    · platform / tactic / labels_canon / platform_terms / route_terms
#      route_terms 是從 1,000 筆抽樣用「區辨力」量出來的（正例命中率 −
#      負例命中率），不是憑感覺列的 —— 每一行後面都寫著數字，要改之前
#      先看那些數字。刻意不放的詞也記了理由。
#    · M1 切語料，已從 1,000 筆抽樣切到全量 17,764 筆
#      （data/ 不進版控，各自本機跑）
#    · M3 向量檢索接上 bge-m3，兩道門檻（相似度 + 手法詞加分），
#      index/ 各自本機建
#    · M4 規則抽取（三層退路的第三層）
#    · stats 的兩個數字（在 194,355 筆共用語料上實測，見檔尾）
#    · 平台詞大小寫：platform_terms 列出 LINE／Line／line 三種寫法，
#      module.py 的 _platform_hit() 對純 ASCII 詞卡字界（避免 online
#      誤中），中文詞照原樣比子字串
#    · eval/route_questions.yaml 的 20 題考題（10 題不含專有名詞），
#      從自己 17,764 筆語料依情境分層取樣、讀真實用詞改寫而成
#    · 平台判定三態化（見下方「2026-09-22 的一次修正」）
#
#  ✅ S16 入場檢查七項：2026-09-22 全過，可以掛載（考題 19/20）
#
#  還沒做，照順序：
#    1. playbook.yaml 的階段與行動清單還是範本的 TODO —— 畫面上「目前
#       階段」「接下來該做什麼」顯示的就是那幾行 TODO 文字（S10）
#       ⚠ 入場檢查第 4 項會過，是因為檢查器把範本 TODO 算成「有行動」。
#         機械上過了、實質上沒過，別被那個 [OK] 誤導
#    2. M2 截圖理解還是 stub，OCR 引擎未選定，screenshots/ 是空的（S11）
#    3. M4 的 prompt 還沒寫，_SLM_PROMPT_READY 還是 False（S13）
#    4. S10 的 60 筆標準答案 —— 考題的 gold_case_ids 全空著、kappa 與
#       Recall@5 都還量不出來，十項指標裡九項卡在這一件事
#    5. negative_terms 與 knowledge_refs 還空著（S18 / S12）
#    6. 資料夾改名：packages/modules/a_tbd → a_line_investment，
#       pack.yaml 的 id 要跟資料夾名一致，.github/team.yml 與
#       .github/CODEOWNERS 的路徑要同步改
#
#  ── 2026-09-22 的一次修正：平台判定從兩態改成三態 ──────────────
#  原本只有兩態：有我的平台詞乘 1.3，其餘一律乘 0.6。那把「沒提任何
#  平台」跟「提到別人的平台」當成同一件事，但前者是資訊不足、後者是
#  證據指向別人，倒扣的理由只對後者成立。
#
#  兩態下的天花板（keyword_score 是飽和函式 hits/(hits+2)）：
#
#    命中   底分     ×0.6（無平台詞）
#      2   0.5000   0.3000
#      3   0.6000   0.3600
#      5   0.7143   0.4286
#     10   0.8333   0.5000  ← 要 10 個命中才碰得到 route_min
#
#  一句口語塞不進 10 個手法詞，所以 10 題不含平台詞的考題全軍覆沒。
#  同一份 20 題，兩態 10/20 → 三態 19/20（唯一沒過的那題是刻意留的
#  詞表缺口，見 route_questions.yaml 第 10 題）。
#  本專案的起點例句「群組裡的老師叫我先入金才能出金」從 0.30 變 0.50。
#
#  中性不是放寬：手法詞仍然要自己掙到 2 個命中（0.50）才過門檻，而
#  「提到別人的平台、沒提到我的」照樣打 0.6 的折 —— 實測「我在臉書看到
#  投資廣告，對方說保證獲利，現在出金失敗」是 0.40，A 不認領。
#  別人的平台詞清單在 module.py 的 OTHER_PLATFORM_TERMS（不能放這裡：
#  PackSpec 設了 extra="forbid"，加欄位要動凍結的 contracts）。
#
#  旁證：PR #41（模組 E）獨立量到同一件事 ——「路由考題與檢索評估集不能
#  共用，檢索評估集刻意避開專有名詞，而 can_handle 正是靠那些詞區分
#  類別」，他們混用時得到 0/20。兩個人從不同方向撞到同一面牆，所以這
#  也該拿到全隊層級討論（範本的出題規則要不要拆成兩份檔案）。
# ═══════════════════════════════════════════════════════════════
id: a_tbd
code: "A"
name: LINE 投資詐騙
owner: Sinediesoft
version: "0.1.0"

# 說明書：A 是免費版開放的那一組（件數最大的一類）
plan: free

# 2026-09-20 決定。改這兩個值等於換一個模組，要連 labels_canon、
# platform_terms、route_terms 與 data/ 的切片一起重來。
platform: "LINE"
tactic: "假投資"

# 從 165 語料的手法軸挑出來的。三個寫法都是同一類，官方標籤本身就不統一。
labels_canon:
  - 假投資詐騙          # 27,751 筆（全量），與 LINE 交集 16,185
  - 假投資              # 2,510 筆，交集 1,394
  - 假投資購物詐騙      # 517 筆，交集 175。偏購物但話術同源，先納入
# 官方標籤有前後空白與全形括號的變體，比對前一律正規化（見 m1_corpus.norm_label）
label_aliases: []
# 實測過的：不分大小寫的 line 命中 81,570 筆（41.97%）。
# 「賴」不能用 —— 1,057 筆裡有 545 筆是「百無聊賴」「依賴」「信賴」，誤判過半。
#
# 🔴 三種大小寫都要列。module.py 的 can_handle() 是 `t in text`，大小寫敏感
#    —— 原本這裡只有小寫的「line」，而 2026-09-21 掃 A 自己的 1,000 筆語料，
#    LINE 出現 1,294 次、line 139 次、Line 122 次。只寫小寫等於九成的案子
#    拿不到平台分。要改成不分大小寫比對是另一回事（見 can_handle 的註解），
#    但就算改了，這三行留著也不會錯。
platform_terms:
  - LINE              # 1,294 次 —— 最常見的寫法，原本抓不到的就是它
  - Line              #   122 次
  - line              #   139 次
  - 加賴              # 59 筆，口語但沒有誤判
# 從抽樣的 1,000 筆量出來的命中率（2026-09-20）。括號內是該詞在切片裡的佔比。
# 「出金 / 提領」是最關鍵的識別點 —— 那是受害者發現被騙的時刻，
# 幾乎只出現在假投資類，其他手法很少提到。
# 挑法是比對「區辨力」＝ 正例命中率 − 負例命中率，
# 負例取 1,000 筆「有提到 line 但不是假投資」的案例 —— 那是最容易混淆的一群。
# 只看正例命中率會挑錯：匯款在正例 29.3%，但在負例 33.7%，區辨力是 −0.04。
route_terms:
  - 投資            # 正 91.7% / 負 15.5%  區辨力 +0.76 ← 最強
  - 獲利            # 正 64.9% / 負  9.3%  +0.56
  - 群組            # 正 44.8% / 負  6.3%  +0.39  ← 2026-09-21 補
  - 保證獲利        # 正 33.9% / 負  5.0%  +0.29
  - 面交            # 正 33.7% / 負  8.0%  +0.26
  - 提領            # 正 30.4% / 負  9.7%  +0.21
  - 出金            # 正 26.2% / 負  6.5%  +0.20
  - 虛擬貨幣        # 正 29.4% / 負  9.1%  +0.20
  - 股票            # 正 16.5% / 負  0.6%  +0.16
  - 賺錢            # 正 20.2% / 負  4.2%  +0.16
  - 穩賺不賠        # 正 20.3% / 負  5.5%  +0.15
  - 投資群組        # 正 17.0% / 負  2.0%  +0.15
#
# 刻意不放的，理由記下來免得之後有人「好心」補回去：
#   匯款  區辨力 −0.04 —— 負例比正例還常見，加了會幫倒忙
#   保證金 區辨力 −0.03 —— 同上，負例 6.7% 比正例 3.9% 還多
#   老師  區辨力 +0.07（正 6.9% / 負 0.3%）—— c_tbd 有收，但照這裡的
#         標準不及格。正例只有 6.9%，收了幾乎沒作用
#   入金  區辨力 +0.04（正 5.8% / 負 1.4%）—— 同上
#   操作  區辨力 +0.13（正 42.8% / 負 29.8%）—— 命中率高但兩邊都高
#   平台  區辨力 +0.08 —— 幾乎所有網路詐騙都有，加了只是稀釋
#   幣    45.0% 但是陷阱 —— 含幣托、泰達幣、新台幣，精確版是「虛擬貨幣」
# 先留空。這個切片裡「求職」只有 6 筆、「檢警」「地檢署」「解除分期」都是 0 筆 ——
# 其他模組的詞本來就不出現，這證明它們是好的區隔詞，但在這裡加了沒有作用。
# TODO(S18)：等路由調校時依混淆矩陣補，那時才看得出真正會混淆的是哪幾類。
negative_terms: []

# TODO(S12)：整理你適用的法條與 165 話術庫段落。條號與版本日期都要確認
knowledge_refs: []

thresholds:
  # 2026-09-20 從 0.55 降到 0.50。實測：口語查詢接手率 17% -> 67%，
  # 而誤接率完全沒變（14.5% -> 14.5%）。原因是飽和函式給的分數是離散的：
  # 2 命中 = 0.500。
  #
  # ⚠ 下面這段原本寫「負例幾乎都含 line 吃到 +0.15 加分」—— 那是 2026-09-20
  #   的加法版本，2026-09-21 已改成雙邊乘法、2026-09-22 再改成三態
  #   （PLATFORM_HIT=1.3／PLATFORM_NEUTRAL=1.0／PLATFORM_MISS=0.6，
  #   見 module.py），所以那個理由早就不成立。
  #
  # 2026-09-22 用 20 題考題量過三態版本：19/20，門檻維持 0.50 不動。
  #
  # 🔴 但有一件事要記著：10 題不含平台詞的考題裡，有 5 題落在 0.5000
  #    ——「剛好等於」route_min（比較是 >=，所以過）。只要 route_min 往上
  #    動一格，或飽和函式的分母改掉，這 5 題會一起掉下去。這個 19/20
  #    沒有安全邊際，調參數前先重跑 eval/route_questions.yaml。
  # TODO(S18)：依混淆矩陣確認 route_min，並量 PLATFORM_NEUTRAL 對誤接率
  #            的影響 —— 目前只驗過「不搶 C 的案子」這一邊（四句抽查），
  #            還不是混淆矩陣
  route_min: 0.50
  route_hint_min: 0.35
priority: 10            # A 先掛（S17 的順序），分數打平時優先

deliverables:
  m1: m1_corpus.py
  m2: m2_vision.py
  m3: m3_retrieval.py
  m4: m4_judgement.py
  m5: m5_agent.py
  playbook: playbook.yaml
  report: REPORT.md

# 2026-09-21 在 194,355 筆共用語料上實測（正規化標籤後比對）。
# 重抓語料或改 labels_canon／platform_terms 之後要重跑 M1 並更新這兩個數字。
stats:
  total_cases: 30778      # 假投資系列標籤，不分平台
  platform_cases: 17764   # 其中內文提得到 LINE 的（門檻 2,000 筆，遠超過）
  # 對照：內文提到 LINE 的案子全部有 81,597 筆，但其中 63,808 筆不是假投資
  # （網路購物 11,300、假交友投資 7,108、假買家 5,826…）—— 詐騙幾乎都在
  # LINE 上談，所以平台單獨不構成分工，這也是 can_handle 把平台當乘法而
  # 不是加分的同一個道理。
