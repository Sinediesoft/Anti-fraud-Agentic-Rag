# ═══════════════════════════════════════════════════════════════
#  模組 A — LINE × 假投資（2026-09-20 決定，2026-09-21 更新這份清單）
#
#  已經做完的：
#    · platform / tactic / labels_canon / platform_terms / route_terms
#      route_terms 是從 1,000 筆抽樣用「區辨力」量出來的（正例命中率 −
#      負例命中率），不是憑感覺列的 —— 每一行後面都寫著數字，要改之前
#      先看那些數字。刻意不放的詞也記了理由。
#    · M1 切語料 1,000 筆（data/ 不進版控，各自本機跑）
#    · M3 向量檢索接上 bge-m3，index/ 各自本機建
#    · M4 規則抽取（三層退路的第三層）
#
#  還沒做，照順序：
#    1. playbook.yaml 的階段與行動清單還是範本的 TODO —— 畫面上「目前
#       階段」「接下來該做什麼」顯示的就是那幾行 TODO 文字（S10）
#    2. M4 的 prompt 還沒寫，_SLM_PROMPT_READY 還是 False（S13）
#    3. eval/route_questions.yaml 的 20 題考題還沒出 —— S16 入場檢查
#       七項裡現在就卡這一項（0/0，要 17/20）（S12）
#    4. negative_terms 與 knowledge_refs 還空著（S18 / S12）
#    5. stats 的兩個數字還是 null（S9）
#    6. 資料夾改名：packages/modules/a_tbd → a_line_investment，
#       pack.yaml 的 id 要跟資料夾名一致，.github/team.yml 與
#       .github/CODEOWNERS 的路徑要同步改
#
#  🔴 已知問題（2026-09-21 路由實測）：下面 platform_terms 的「line」是
#     小寫，但 module.py 的 can_handle() 用 `t in text` 比對，大小寫敏感。
#     實測 1,000 筆語料裡 837 筆寫的是大寫「LINE」—— 也就是九成的案子
#     拿不到那 +0.15 的平台加分。thresholds.route_min 那段註解假設加分
#     有生效，實際上沒有，那個門檻要重新量。
# ═══════════════════════════════════════════════════════════════
id: a_tbd
code: "A"
name: LINE 投資詐騙
owner: Sinediesoft
version: "0.1.0"

# 說明書：A 是免費版開放的那一組（件數最大的一類）
plan: free

# 2026-09-20 決定。改這兩個值等於換一個模組，要連 labels_canon、
# platform_terms、route_terms 與 data/ 的切片一起重來。
platform: "LINE"
tactic: "假投資"

# 從 165 語料的手法軸挑出來的。三個寫法都是同一類，官方標籤本身就不統一。
labels_canon:
  - 假投資詐騙          # 27,751 筆（全量），與 LINE 交集 16,185
  - 假投資              # 2,510 筆，交集 1,394
  - 假投資購物詐騙      # 517 筆，交集 175。偏購物但話術同源，先納入
# 官方標籤有前後空白與全形括號的變體，比對前一律正規化（見 m1_corpus.norm_label）
label_aliases: []
# 實測過的：不分大小寫的 line 命中 81,570 筆（41.97%）。
# 「賴」不能用 —— 1,057 筆裡有 545 筆是「百無聊賴」「依賴」「信賴」，誤判過半。
#
# 🔴 三種大小寫都要列。module.py 的 can_handle() 是 `t in text`，大小寫敏感
#    —— 原本這裡只有小寫的「line」，而 2026-09-21 掃 A 自己的 1,000 筆語料，
#    LINE 出現 1,294 次、line 139 次、Line 122 次。只寫小寫等於九成的案子
#    拿不到平台分。要改成不分大小寫比對是另一回事（見 can_handle 的註解），
#    但就算改了，這三行留著也不會錯。
platform_terms:
  - LINE              # 1,294 次 —— 最常見的寫法，原本抓不到的就是它
  - Line              #   122 次
  - line              #   139 次
  - 加賴              # 59 筆，口語但沒有誤判
# 從抽樣的 1,000 筆量出來的命中率（2026-09-20）。括號內是該詞在切片裡的佔比。
# 「出金 / 提領」是最關鍵的識別點 —— 那是受害者發現被騙的時刻，
# 幾乎只出現在假投資類，其他手法很少提到。
# 挑法是比對「區辨力」＝ 正例命中率 − 負例命中率，
# 負例取 1,000 筆「有提到 line 但不是假投資」的案例 —— 那是最容易混淆的一群。
# 只看正例命中率會挑錯：匯款在正例 29.3%，但在負例 33.7%，區辨力是 −0.04。
route_terms:
  - 投資            # 正 91.7% / 負 15.5%  區辨力 +0.76 ← 最強
  - 獲利            # 正 64.9% / 負  9.3%  +0.56
  - 群組            # 正 44.8% / 負  6.3%  +0.39  ← 2026-09-21 補
  - 保證獲利        # 正 33.9% / 負  5.0%  +0.29
  - 面交            # 正 33.7% / 負  8.0%  +0.26
  - 提領            # 正 30.4% / 負  9.7%  +0.21
  - 出金            # 正 26.2% / 負  6.5%  +0.20
  - 虛擬貨幣        # 正 29.4% / 負  9.1%  +0.20
  - 股票            # 正 16.5% / 負  0.6%  +0.16
  - 賺錢            # 正 20.2% / 負  4.2%  +0.16
  - 穩賺不賠        # 正 20.3% / 負  5.5%  +0.15
  - 投資群組        # 正 17.0% / 負  2.0%  +0.15
#
# 刻意不放的，理由記下來免得之後有人「好心」補回去：
#   匯款  區辨力 −0.04 —— 負例比正例還常見，加了會幫倒忙
#   保證金 區辨力 −0.03 —— 同上，負例 6.7% 比正例 3.9% 還多
#   老師  區辨力 +0.07（正 6.9% / 負 0.3%）—— c_tbd 有收，但照這裡的
#         標準不及格。正例只有 6.9%，收了幾乎沒作用
#   入金  區辨力 +0.04（正 5.8% / 負 1.4%）—— 同上
#   操作  區辨力 +0.13（正 42.8% / 負 29.8%）—— 命中率高但兩邊都高
#   平台  區辨力 +0.08 —— 幾乎所有網路詐騙都有，加了只是稀釋
#   幣    45.0% 但是陷阱 —— 含幣托、泰達幣、新台幣，精確版是「虛擬貨幣」
# 先留空。這個切片裡「求職」只有 6 筆、「檢警」「地檢署」「解除分期」都是 0 筆 ——
# 其他模組的詞本來就不出現，這證明它們是好的區隔詞，但在這裡加了沒有作用。
# TODO(S18)：等路由調校時依混淆矩陣補，那時才看得出真正會混淆的是哪幾類。
negative_terms: []

# TODO(S12)：整理你適用的法條與 165 話術庫段落。條號與版本日期都要確認
knowledge_refs: []

thresholds:
  # 2026-09-20 從 0.55 降到 0.50。實測：口語查詢接手率 17% -> 67%，
  # 而誤接率完全沒變（14.5% -> 14.5%）。原因是飽和函式給的分數是離散的：
  # 2 命中 = 0.500，而負例幾乎都含 line 吃到 +0.15 加分早就越過 0.55 了，
  # 所以這個門檻只擋得住「沒說平台的短句」—— 那正是真實使用者的打字方式。
  # TODO(S18)：路由調校時依混淆矩陣再確認一次
  route_min: 0.50
  route_hint_min: 0.35
priority: 10            # A 先掛（S17 的順序），分數打平時優先

deliverables:
  m1: m1_corpus.py
  m2: m2_vision.py
  m3: m3_retrieval.py
  m4: m4_judgement.py
  m5: m5_agent.py
  playbook: playbook.yaml
  report: REPORT.md

stats:
  total_cases: null       # TODO(S9)：這個手法總共幾筆
  platform_cases: null    # TODO(S9)：其中在我的平台上的幾筆（門檻 2,000 筆）
