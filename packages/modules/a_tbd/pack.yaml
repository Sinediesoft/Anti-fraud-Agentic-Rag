id: a_tbd
code: "A"
name: LINE 投資詐騙
owner: Sinediesoft
version: "0.1.0"

# 說明書：A 是免費版開放的那一組（件數最大的一類）
plan: free

# 2026-09-20 決定。改這兩個值等於換一個模組，要連 labels_canon、
# platform_terms、route_terms 與 data/ 的切片一起重來。
platform: "LINE"
tactic: "假投資"

# 從 165 語料的手法軸挑出來的。三個寫法都是同一類，官方標籤本身就不統一。
labels_canon:
  - 假投資詐騙          # 27,751 筆（全量），與 LINE 交集 16,185
  - 假投資              # 2,510 筆，交集 1,394
  - 假投資購物詐騙      # 517 筆，交集 175。偏購物但話術同源，先納入
# 官方標籤有前後空白與全形括號的變體，比對前一律正規化（見 m1_corpus.norm_label）
label_aliases: []
# 實測過的：不分大小寫的 line 命中 81,570 筆（41.97%）。
# 「賴」不能用 —— 1,057 筆裡有 545 筆是「百無聊賴」「依賴」「信賴」，誤判過半。
#
# 🔴 三種大小寫都要列。module.py 的 can_handle() 是 `t in text`，大小寫敏感
#    —— 原本這裡只有小寫的「line」，而 2026-09-21 掃 A 自己的 1,000 筆語料，
#    LINE 出現 1,294 次、line 139 次、Line 122 次。只寫小寫等於九成的案子
#    拿不到平台分。要改成不分大小寫比對是另一回事（見 can_handle 的註解），
#    但就算改了，這三行留著也不會錯。
platform_terms:
  - LINE              # 1,294 次 —— 最常見的寫法，原本抓不到的就是它
  - Line              #   122 次
  - line              #   139 次
  - 加賴              # 59 筆，口語但沒有誤判
# 從抽樣的 1,000 筆量出來的命中率（2026-09-20）。括號內是該詞在切片裡的佔比。
# 「出金 / 提領」是最關鍵的識別點 —— 那是受害者發現被騙的時刻，
# 幾乎只出現在假投資類，其他手法很少提到。
# 挑法是比對「區辨力」＝ 正例命中率 − 負例命中率，
# 負例取 1,000 筆「有提到 line 但不是假投資」的案例 —— 那是最容易混淆的一群。
# 只看正例命中率會挑錯：匯款在正例 29.3%，但在負例 33.7%，區辨力是 −0.04。
route_terms:
  - 投資            # 正 91.7% / 負 15.5%  區辨力 +0.76 ← 最強
  - 獲利            # 正 64.9% / 負  9.3%  +0.56
  - 群組            # 正 44.8% / 負  6.3%  +0.39  ← 2026-09-21 補
  - 保證獲利        # 正 33.9% / 負  5.0%  +0.29
  - 面交            # 正 33.7% / 負  8.0%  +0.26
  - 提領            # 正 30.4% / 負  9.7%  +0.21
  - 出金            # 正 26.2% / 負  6.5%  +0.20
  - 虛擬貨幣        # 正 29.4% / 負  9.1%  +0.20
  - 股票            # 正 16.5% / 負  0.6%  +0.16
  - 賺錢            # 正 20.2% / 負  4.2%  +0.16
  - 穩賺不賠        # 正 20.3% / 負  5.5%  +0.15
  - 投資群組        # 正 17.0% / 負  2.0%  +0.15
#
# 刻意不放的，理由記下來免得之後有人「好心」補回去：
#   匯款  區辨力 −0.04 —— 負例比正例還常見，加了會幫倒忙
#   保證金 區辨力 −0.03 —— 同上，負例 6.7% 比正例 3.9% 還多
#   老師  區辨力 +0.07（正 6.9% / 負 0.3%）—— c_tbd 有收，但照這裡的
#         標準不及格。正例只有 6.9%，收了幾乎沒作用
#   入金  區辨力 +0.04（正 5.8% / 負 1.4%）—— 同上
#   操作  區辨力 +0.13（正 42.8% / 負 29.8%）—— 命中率高但兩邊都高
#   平台  區辨力 +0.08 —— 幾乎所有網路詐騙都有，加了只是稀釋
#   幣    45.0% 但是陷阱 —— 含幣托、泰達幣、新台幣，精確版是「虛擬貨幣」
#
# ══════════════════════════════════════════════════════════════
#  🔴 先讀這個：上面每一行的數字與下面的數字，樣本不一樣
# ══════════════════════════════════════════════════════════════
# 上面 route_terms 每一行的百分比是 2026-09-20 從**1,000 筆抽樣**量的。
# 下面 2026-09-22 那一整段是**全量**量的（正例 17,764、負例 63,841）。
# 兩者不能直接比大小，而且抽樣值對某幾個詞低估得很嚴重：
#
#   詞        抽樣正%  抽樣區辨   全量正%  全量區辨   落差
#   投資        91.7    +0.76     92.8    +0.790   幾乎一致
#   獲利        64.9    +0.56     66.7    +0.575   幾乎一致
#   群組        44.8    +0.39     48.1    +0.414   幾乎一致
#   穩賺不賠     20.3    +0.15     47.0    +0.409   🔴 正例率是抽樣的 2.3 倍
#   賺錢        20.2    +0.16     38.5    +0.347   🔴 1.9 倍
#   提領        30.4    +0.21     40.8    +0.312   低估
#   保證獲利     33.9    +0.29     36.1    +0.312   幾乎一致
#   出金        26.2    +0.20     35.8    +0.293   低估
#   面交        33.7    +0.26     33.3    +0.270   幾乎一致
#   投資群組     17.0    +0.15     24.2    +0.229   低估
#   虛擬貨幣     29.4    +0.20     29.0    +0.211   幾乎一致
#   股票        16.5    +0.16     17.6    +0.170   幾乎一致
#
# 強弱排序整個變了：
#   抽樣  投資>獲利>群組>保證獲利>面交>提領>出金>虛擬貨幣>股票>賺錢>穩賺不賠>投資群組
#   全量  投資>獲利>群組>穩賺不賠>賺錢>提領>保證獲利>出金>面交>投資群組>虛擬貨幣>股票
#
# 所以「要改之前先看那些數字」這句話要補一個條件：**看全量那一欄**。
# 照抽樣值判斷會把「穩賺不賠」「賺錢」當成最弱的兩個詞 —— 它們其實排第
# 四和第五。哪天有人要精簡詞表，別照上面那些數字砍。
#
# 上面每行的抽樣值刻意保留不改：那是 2026-09-20 當下的真實量測，也是當初
# 挑詞決策的依據，改掉就看不出決策是怎麼做的了。
# TODO(S9)：真要收斂成一套數字，就把 route_terms 每行的註解重量成全量值，
#           並在這裡註明那次重量的日期 —— 但那要連「刻意不放的」那份清單
#           一起重量，否則兩份清單又會變成不同基準。
#
# ══════════════════════════════════════════════════════════════
#  2026-09-22：評估過「補詞」並決定不補。這段記結論，別再重跑一次
# ══════════════════════════════════════════════════════════════
# 起因：20 題考題裡有 5 題（第 1、4、6、7、8）剛好落在 0.5000，想補詞
# 讓它們多中一個詞跳到 0.60。在全量語料上重量了一輪（正例 17,764、
# 負例 63,841「有提到 LINE 但不是假投資」），結論是**不補**。
#
# ── 一、逐詞的區辨力在門檻附近不是對的判準 ──────────────────
# 挖出三個乾淨過關（區辨力 >= +0.15 且不與現有詞重疊）的候選詞，
# 但加進去之後路由反而變差：
#
#   詞表                     正例接手率   負例誤接率      差距
#   現況（12 手法詞 + 3 標籤）   93.5%      14.9%     +78.6%
#   + 網站                      94.6%      16.5%     +78.1%
#   + 網站 + 廣告               95.7%      20.0%     +75.7%
#   + 網站 + 廣告 + 申請        95.9%      22.6%     +73.3%
#
# 正例只多接 2.4 個百分點，誤接多了 7.7 —— 每加一個詞差距都在縮小。
# 「網站」的區辨力 +0.304（正 47.6% / 負 17.2%）遠高於表內最低的
# 「股票」（+0.16），照舊標準該收 —— 但它的負例率 17.2% 足以把一堆
# 「原本只中 1 個詞」的別人案子推過 2 命中的門檻，而飽和函式在 2 命中
# 就跳到 0.50。**負例率超過一成的詞，代價比收益大，不管區辨力多高。**
# 現有這 12 個詞已經在很好的操作點上。
#
# 廣告 +0.236（正 37.6% / 負 14.0%）、申請 +0.209（正 32.0% / 負 11.1%）
# 同理。另外頂部一堆高分詞是既有詞的碎片（穩賺、不賠、證獲利、投資訊息
# …），加那些只會讓同一段文字重複計分，是鑽飽和函式的漏洞，不是訊號。
#
# ── 二、那 5 題要的詞，量出來全部不及格 ────────────────────
#   詞    出現在      正例     負例    區辨力
#   老師  第 1、8 題   6.6%    0.5%   +0.061
#   入金  第 1 題      5.5%    1.0%   +0.045
#   帳面  第 8 題      5.0%    0.7%   +0.042
#   加碼  第 10 題     4.5%    0.7%   +0.038
#   下單  第 8 題      1.6%    8.2%   −0.066  ← 反向訊號
#   客服  第 7 題     16.5%   31.5%   −0.150  ← 反向訊號，那是 D 的地盤
#
# 第 7、8 題裡甚至含有反指標。老師與入金在全量上重量的結果與當初
# 1,000 筆抽樣一致（+0.07 / +0.04），原本的排除判斷站得住。
#
# ── 三、「補出金的變體」這個假設也錯了 ─────────────────────
# 起點：出金／提領是最關鍵的識別點，而「出金」是子字串比對，抓不到
# 「出不了金」（是 出-不-了-金，沒有連續的「出金」）—— 第 6 題就是這樣
# 掉分的。所以想補它的口語變體。量完發現兩頭都堵住：
#
#   詞          正例筆數/17,764   正例率   負例筆數   區辨力
#   出金（現有）      6,363       35.8%    4,158    +0.293
#   提領（現有）      7,242       40.8%    6,086    +0.312
#   ── 唯一高頻的變體 ──
#   無法出金          3,380       19.0%    1,739    +0.163
#   ── 沒被涵蓋的變體，全部低於 1% ──
#   提不出              170        1.0%       87    +0.008
#   拿不回              171        1.0%      269    +0.005
#   領不出              112        0.6%      108    +0.005
#   出不了金             78        0.4%       50    +0.004
#   出不來               35        0.2%       25    +0.002
#   領不回                5        0.0%        5    +0.000
#
# 兩頭堵住的意思：
#   · 「無法出金」**包含「出金」這個子字串**，所以「出金」早就在那 3,380
#     筆上全部命中了。加它不會多涵蓋任何一筆，只會在同一段文字上重複
#     計分、把分數虛抬
#   · 沒被「出金」涵蓋的變體全部低於 1% —— 一個只出現在 0.4% 案件裡的詞，
#     最多讓 78 筆多中一個詞，而飽和函式要 2 命中才到 0.50
#
# ⚠ 這組數字說的是「這些講法在**語料裡**很罕見」，不是「受害者不會這樣
#   講」。受害者確實會說「出不了金」「拿不回來」—— 考題就是這樣寫的。
#   精確的結論是：這份資料看不見那些詞，所以量不出它們的價值。接第四點。
#
# ── 四、根因：量尺和語料講不同的話 ─────────────────────────
# **語料是筆錄體，題目是口語。** 真實報案寫「無法出金」（19.0%），
# 受害者打字說「出不了金」（0.4%）。考題刻意寫成口語是對的 —— 那才是
# 使用者 —— 但代價是：**在筆錄體語料上量區辨力，永遠無法支持補口語詞**，
# 因為那些詞在語料裡幾乎不存在。
#
# 說明書要求「20 題從 S10 那 60 筆抽」正是為了避開這件事 —— 從標註案例
# 出題，題目就會跟語料同一種語域。gold_case_ids 空著的代價就在這裡。
# 所以這 5 題的邊際問題，正解是做 S10，不是改詞表或改門檻。
# 先留空。這個切片裡「求職」只有 6 筆、「檢警」「地檢署」「解除分期」都是 0 筆 ——
# 其他模組的詞本來就不出現，這證明它們是好的區隔詞，但在這裡加了沒有作用。
# TODO(S18)：等路由調校時依混淆矩陣補，那時才看得出真正會混淆的是哪幾類。
negative_terms: []

# TODO(S12)：整理你適用的法條與 165 話術庫段落。條號與版本日期都要確認
knowledge_refs: []

thresholds:
  # 2026-09-20 從 0.55 降到 0.50。實測：口語查詢接手率 17% -> 67%，
  # 而誤接率完全沒變（14.5% -> 14.5%）。原因是飽和函式給的分數是離散的：
  # 2 命中 = 0.500。
  #
  # ⚠ 下面這段原本寫「負例幾乎都含 line 吃到 +0.15 加分」—— 那是 2026-09-20
  #   的加法版本，2026-09-21 已改成雙邊乘法、2026-09-22 再改成三態
  #   （PLATFORM_HIT=1.3／PLATFORM_NEUTRAL=1.0／PLATFORM_MISS=0.6，
  #   見 module.py），所以那個理由早就不成立。
  #
  # 2026-09-22 用 20 題考題量過三態版本：19/20，門檻維持 0.50 不動。
  #
  # 有 5 題（第 1、4、6、7、8）落在 0.5000，「剛好等於」route_min
  #（比較是 >=，所以過）。但這個邊際沒有原先想的那麼脆，因為分數是離散的
  # —— 同一天在全量語料上掃過門檻：
  #
  #   route_min      正例接手率   負例誤接率
  #     0.43           98.3%       28.2%
  #     0.45 ～ 0.55    93.5%       14.9%   ← 全部是同一個操作點
  #
  # 有平台詞時分數從 1 命中的 0.4333 直接跳到 2 命中的 0.65，中間沒有
  # 任何可能出現的值。所以 0.45／0.48／0.50／0.52／0.55 的行為完全一樣，
  # 沒有人會有理由把門檻微調到 0.51；真要動只有掉到 0.4333 以下才有
  # 意義，而那會讓誤接率跳到 28.2%。
  #
  # 會讓那 5 題掉下去的只有兩件事：把 route_min 拉到 0.50 以上，或改掉
  # keyword_score 的分母（hits+2）。動這兩者之前先重跑
  # eval/route_questions.yaml。
  #
  # 補詞讓它們拿到邊際這條路評估過了，結論是不補 —— 見 route_terms
  # 下面「2026-09-22：評估過補詞並決定不補」那一段。正解是做 S10，
  # 從標註案例重新出題。
  #
  # TODO(S18)：依混淆矩陣確認 route_min。目前量到的是「提到 LINE」這
  #            一群的正負例（17,764 / 63,841），還不是各模組之間的混淆
  #            矩陣；PLATFORM_NEUTRAL 對誤接率的影響也只驗過「不搶 C 的
  #            案子」這一邊（四句抽查）。另外若哪天要把 route_min 降到
  #            0.45，記得那會讓「提到別人平台且中 6 個詞」的案子（
  #            0.75 × 0.6 = 0.45）剛好被接走 —— 那一邊還沒量。
  route_min: 0.50
  route_hint_min: 0.35
priority: 10            # A 先掛（S17 的順序），分數打平時優先

deliverables:
