# 20 題路由考題（說明書 S16 入場檢查第 3 項、S20 路由測驗）。
#
# **全部從 S10 的 60 筆標準答案改寫而來**，每題都有 gold_case_ids。
# 這是說明書要求的出題方式——2026-09-22 之前這 20 題是自編的，
# 而真實案例的 can_handle 命中率（58%）反而高於自編題目（11/20），
# 代表自編題目偏離了真實分布，繼續對它調參數只會過擬合。
#
# ⚠ 這份**不是**檢索評估集，兩者用途不同不能共用：
#
#   路由考題（這份）  測 can_handle —— 要含使用者會轉述的話術，
#                     那正是模組用來區分類別的線索
#   檢索評估集        測 Recall@5 —— 刻意避開專有名詞，否則詞彙比對
#                     會不公平地佔便宜（見 eval/retrieval_queries.yaml）
#
# 實測過：把檢索評估集拿來測 can_handle 會得到 0/20，不是詞表壞掉，
# 是那批題目設計上就避開了路由所需的線索。
#
# 改寫原則：
#   1. 口語化，像受害者自己打的字。**不照抄案例原文**——原文不得外流
#   2. 保留話術關鍵詞（實名認證、賣貨便、客服…）。受害者陳述時本來就會
#      轉述對方用過的詞，那也正是路由的依據
#   3. 每階段 4 題，涵蓋 none / paid / repeated / credentials / drained
#   4. **保留平台脈絡**。gold 案例有 94% 提到平台（m1_corpus 本來就是用平台詞篩的），
#      真實陳述會講「我在 Threads 看到…」。第一版為了讓句子聚焦話術而拿掉平台詞，
#      等於造出現實中不存在的題目——而 can_handle 把平台當必要條件，那批題目全落榜。
#
# 抽樣：從 gold 60 筆依階段分層各抽 4 筆，seed 20260922。

