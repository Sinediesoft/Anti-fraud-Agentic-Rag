# 20 題路由考題（說明書 S16 入場檢查第 3 項、S20 路由測驗）。
#
# 2026-09-23 全部重出。原因：與模組 D 談定界線後語料重切（9,167 → 4,140），
# 原本 20 題有 11 題的 gold 案例落到 D 的地盤（超商物流），檢索找不回來，
# recall_at_5 從 1.000 掉到 0.700。舊題不是壞掉，是指向了不再屬於本模組的案例。
#
# ⚠ 這份**不是**檢索評估集，兩者用途不同不能共用：
#
#   路由考題（這份）  測 can_handle —— 要含使用者會轉述的話術，
#                     那正是模組用來區分類別的線索
#   檢索評估集        測 Recall@5 —— 刻意避開專有名詞，否則詞彙比對
#                     會不公平地佔便宜
#
# 出題方式：從 4,140 筆語料依 Harm 五級分層抽樣，每筆改寫成受害者會打的字。
# 改寫不是抄原文——案例是真實受害者陳述，只取情節結構，人名、金額、商品都改掉。
#
# ⚠ 界線：本模組不收超商物流（賣貨便／交貨便／全家／7-11／店到店），那些歸 D。
#   所以這 20 題刻意都不含那些詞。
#
# 題目組成刻意不照母體分布（沿用 40 題評估集的出題原則第 4 條）：
# 純交易糾紛（付錢沒收到貨、對方消失）在母體佔比不低，但只放 3 題。
# 理由是路由考題要反映「會來問的情境」——會問「這是不是詐騙」的人通常是
# 因為出現話術才覺得怪；純糾紛的人已經知道被騙了，不需要路由判斷。
# 那類案例 can_handle 給低分是正確的（S4：不確定就給低分），不是缺陷。

