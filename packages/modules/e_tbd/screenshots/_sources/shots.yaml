- id: e06_jobpost_lowres
  layout: ad_post
  variant: {width: 720, theme: light, quality: low_res}
  is_scam: true
  notes: 低解析度。真實使用者常常是轉傳好幾手的圖
  blocks:
    - {text: 徵 兼職助理, role: title}
    - {text: "日領 2,500", role: price}
    - {text: 免經驗 可在家 時間彈性, role: body}
    - {text: 詳情加 LINE 詢問, role: body}

- id: e07_chat_intro
  layout: chat
  variant: {width: 720, theme: light, quality: sharp}
  is_scam: false
  notes: 面試開場還看不出問題。對照組——前半段跟正常求職沒有差別
  blocks:
    - {text: 您好，看到您在社團應徵，我是人資小林, role: bubble, speaker: other}
    - {text: 您好，請問工作內容是什麼呢, role: bubble, speaker: self}
    - {text: 主要是協助處理公司的訂單與資料建檔, role: bubble, speaker: other}
    - {text: 時間很彈性，一天大概 3 到 4 小時, role: bubble, speaker: other}
    - {text: 好的，那薪水怎麼算, role: bubble, speaker: self}
    - {text: "日結，一天 2,500，做滿一週另外加獎金", role: bubble, speaker: other}

- id: e08_chat_id_request
  layout: chat
  variant: {width: 720, theme: light, quality: sharp}
  is_scam: true
  notes: 要求身分證。索取存摺的前一步
  blocks:
    - {text: 那我幫您建檔，需要您的基本資料, role: bubble, speaker: other}
    - {text: 好的, role: bubble, speaker: self}
    - {text: 麻煩拍身分證正反面給我, role: bubble, speaker: other}
    - {text: 健保卡也一起，我們人事系統要雙證件, role: bubble, speaker: other}
    - {text: 這個一定要嗎, role: bubble, speaker: self}
    - {text: 對呀，正式員工都要建檔的，很快就好, role: bubble, speaker: other}

- id: e09_chat_passbook
  layout: chat
  variant: {width: 720, theme: light, quality: sharp}
  is_scam: true
  notes: 說明書 S11 為 E 點名的關鍵畫面
  blocks:
    - {text: 資料收到了，再來要設定薪轉, role: bubble, speaker: other}
    - {text: 麻煩提供存摺封面照片, role: bubble, speaker: other}
    - {text: 要拍到帳號跟戶名那一面, role: bubble, speaker: other}
    - {text: 這是要做什麼用的, role: bubble, speaker: self}
    - {text: 薪水要匯給您呀，沒有帳號沒辦法匯款, role: bubble, speaker: other}
    - {text: 我們公司都是這樣走流程的, role: bubble, speaker: other}

- id: e10_chat_card_mail
  layout: chat
  variant: {width: 720, theme: light, quality: sharp}
  is_scam: true
  notes: 要求寄出提款卡
  blocks:
    - {text: 因為您是新人，帳務要走公司的系統, role: bubble, speaker: other}
    - {text: 提款卡先寄給財務部設定，設定完就寄回, role: bubble, speaker: other}
    - {text: 店到店就可以，運費我們出, role: bubble, speaker: other}
    - {text: 卡片寄出去不會有問題嗎, role: bubble, speaker: self}
    - {text: 不會，我們每個新人都這樣，公司有保險, role: bubble, speaker: other}
    - {text: 寄好把單號給我，我請財務盡快處理, role: bubble, speaker: other}

- id: e11_chat_netbank
  layout: chat
  variant: {width: 720, theme: light, quality: sharp}
  is_scam: true
  notes: 索取網銀帳密與驗證碼
  blocks:
    - {text: 系統這邊還要綁定網路銀行, role: bubble, speaker: other}
    - {text: 帳號跟密碼給我，我幫您設定就好, role: bubble, speaker: other}
    - {text: 密碼也要給嗎, role: bubble, speaker: self}
    - {text: 對，不然系統綁不了, role: bubble, speaker: other}
    - {text: 剛剛有傳簡訊給您，把那組六位數字給我, role: bubble, speaker: other}
    - {text: 這是公司內部系統，很安全您放心, role: bubble, speaker: other}

- id: e12_chat_dark
  layout: chat
  variant: {width: 720, theme: dark, quality: sharp}
  is_scam: true
  notes: 深色模式。氣泡左右判定在深色下是另一組顏色條件
  blocks:
    - {text: 明天有一筆款項會進您的帳戶, role: bubble, speaker: other}
    - {text: 進來之後麻煩您先不要動, role: bubble, speaker: other}
    - {text: 等我通知再處理, role: bubble, speaker: other}
    - {text: 這是什麼錢, role: bubble, speaker: self}
    - {text: 客戶的貨款，我們公司帳戶在審核不能收, role: bubble, speaker: other}

- id: e13_chat_group
  layout: chat
  variant: {width: 720, theme: light, quality: sharp}
  is_scam: true
  notes: 多人群組。說明書說多發話人氣泡分群是全系統最難的
  blocks:
    - {text: 大家好，歡迎新夥伴加入, role: bubble, speaker: other}
    - {text: 請新人先把資料傳給主管建檔, role: bubble, speaker: other}
    - {text: 我昨天傳了，今天就收到第一筆了, role: bubble, speaker: other}
    - {text: 真的假的 這麼快, role: bubble, speaker: self}
    - {text: 對呀 我做兩週領了六萬, role: bubble, speaker: other}
    - {text: 新人不要怕 照主管說的做就好, role: bubble, speaker: other}

- id: e14_chat_blurred
  layout: chat
  variant: {width: 720, theme: light, quality: blurred}
  is_scam: true
  notes: 手震拍糊。真實使用者上傳的就是這樣
  blocks:
    - {text: 卡片寄了嗎, role: bubble, speaker: other}
    - {text: 寄了 昨天下午, role: bubble, speaker: self}
    - {text: 單號給我, role: bubble, speaker: other}
    - {text: 密碼記得一起傳, role: bubble, speaker: other}

- id: e15_chat_withdraw
  layout: chat
  variant: {width: 720, theme: light, quality: sharp}
  is_scam: true
  notes: 指示提領現金交付——風險最高的一步
  blocks:
    - {text: 錢進來了嗎, role: bubble, speaker: other}
    - {text: 進來了 有 38 萬, role: bubble, speaker: self}
    - {text: 好 您現在去提款機領出來, role: bubble, speaker: other}
    - {text: 一次領不完就分幾次, role: bubble, speaker: other}
    - {text: 領完在超商等，會有專員去跟您拿, role: bubble, speaker: other}
    - {text: 這樣可以嗎 我有點怕, role: bubble, speaker: self}
    - {text: 放心 這是公司的資金調度流程, role: bubble, speaker: other}

- id: e16_sms_interview
