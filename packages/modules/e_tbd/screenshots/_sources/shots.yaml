# 模組 E 的 20 張模擬截圖定義（S11）
#
# 這份是唯一的資料來源：render.py 讀它產生 PNG，同時產生 annotations.yaml。
# 所以圖跟標註不可能對不上 —— 標註不是事後標的，是畫面本來就是照它畫的。
#
# 全部內容為虛構。商家名、人名、電話、帳號、網址都是編的，
# 沒有任何一個字來自真實案例（說明書 S11：絕對不要用真實受害者的截圖）。
#
# 2026-09-23 全面改寫。舊版是「假求職 × 人頭帳戶」時期畫的（職缺貼文、面試對話、
# 索取存摺），題目 09-21 已論證改為 Threads × 網路購物詐騙，畫面卻沒跟著換。
# 版型、三張對照組、變化組合（2 深色 / 2 低解析 / 1 拍糊）沿用舊版設計 ——
# 那部分跟題目無關，換掉的是內容。
#
# 取材依據：S10 的 60 筆標準答案歸納出的劇本 ——
#   Threads 看到貼文 → 私訊改加 LINE → 給假賣貨便連結 → 下單後「未完成實名制認證」
#   → 假客服要求驗證 → 匯款（常重複多筆）→ 網銀帳密 / 驗證碼 / 分享螢幕 / 付款碼
#   → 少數走到寄金融卡、無卡提款
# 五個階段（none / paid / repeated / credentials / drained）每一段都要有畫面。

# ── 貼文與商品頁（6 張）────────────────────────────────

- id: e01_post_normal
  layout: ad_post
  variant: {width: 720, theme: light, quality: sharp}
  is_scam: false
  notes: 正常的二手轉售貼文。對照組——只餵詐騙樣本會讓模型看到賣東西就報警
  blocks:
    - {text: 二手 Switch 主機出售, role: title}
    - {text: "6,800 元", role: price}
    - {text: 台北 / 可面交 / 附原廠盒裝, role: field}
    - {text: 用不到兩年，功能正常，附一片健身環。盒裝說明書都在。, role: body}
    - {text: 可以約捷運站面交驗機，不寄送。有問題留言問我。, role: body}
    - {text: 留言詢問, role: button}

- id: e02_post_underpriced
  layout: ad_post
  variant: {width: 720, theme: light, quality: sharp}
  is_scam: true
  notes: 價格明顯低於行情、限時限量、要求私訊詳談。詐騙貼文最常見的樣子
  blocks:
    - {text: 全新未拆 耳機出清（最後 3 組）, role: title}
    - {text: "1,280 元（原價 7,490）", role: price}
    - {text: 限今日 / 數量有限 / 售完不補, role: field}
    - {text: 公司福委會團購剩餘，保證原廠公司貨，非水貨。, role: body}
    - {text: 想要的直接私訊我，留言的不一定看得到。, role: body}
    - {text: 私訊我, role: button}

- id: e03_product_page
  layout: ad_post
  variant: {width: 720, theme: light, quality: sharp}
  is_scam: true
  notes: 欄位齊全的商品頁但賣家資訊空泛。S11 要求抓得到結構化欄位
  blocks:
    - {text: 演唱會門票 搖滾區 2 張, role: title}
    - {text: "單張 4,500 元", role: price}
    - {text: "運費：60 元（超商取貨）", role: field}
    - {text: "出貨時間：付款後 24 小時內", role: field}
    - {text: "賣家：熱門票券小舖", role: field}
    - {text: "聯絡方式：僅接受通訊軟體私訊", role: field}
    - {text: 因票券為記名制，下單後請等候客服聯繫辦理過戶。, role: body}
    - {text: 立即下單, role: button}

- id: e04_post_ticket
  layout: ad_post
  variant: {width: 720, theme: light, quality: sharp}
  is_scam: true
  notes: 熱門票券現貨。急迫性話術加上只收匯款
  blocks:
    - {text: 【現貨】巨蛋場 內場連號 直接轉, role: title}
    - {text: "一張 3,200 元 兩張一起 6,000", role: price}
    - {text: 今晚 12 點前匯款保留 / 逾時讓給下一位, role: field}
    - {text: 本人有事不能去，原價轉讓不賺價差。, role: body}
    - {text: 先匯訂金就幫你留，剩下的取票當天再付。, role: body}
    - {text: 私訊搶票, role: button}

- id: e05_post_dark
  layout: ad_post
  variant: {width: 720, theme: dark, quality: sharp}
  is_scam: true
  notes: 同類貼文的深色模式。深色不是把顏色反過來就好，配色條件是另一組
  blocks:
    - {text: 樂園門票 代訂（一日券）, role: title}
    - {text: "特價 1,980 元", role: price}
    - {text: 內部員工票 / 名額有限, role: field}
    - {text: 親戚在旅行社，拿得到內部價，僅剩幾個名額。, role: body}
    - {text: 需先付全額訂金，出票後給您電子憑證。, role: body}
    - {text: 加我 LINE 詢問, role: button}

- id: e06_post_lowres
  layout: ad_post
  variant: {width: 720, theme: light, quality: low_res}
  is_scam: true
  notes: 低解析度。真實使用者常常是轉傳好幾手的圖
  blocks:
    - {text: 二手單眼相機 便宜出, role: title}
    - {text: "9,500 元", role: price}
    - {text: 全省可寄 / 貨到付款, role: field}
    - {text: 急需用錢所以便宜賣，功能都正常。, role: body}
    - {text: 有興趣私我，回訊比較快。, role: body}
    - {text: 私訊, role: button}

# ── 私訊對話（9 張）────────────────────────────────────

- id: e07_chat_normal
  layout: chat
  variant: {width: 720, theme: light, quality: sharp}
  is_scam: false
  notes: 正常的議價與約面交。對照組——前半段跟詐騙對話沒有差別
  blocks:
    - {text: 賣家 阿明, role: title}
    - {text: 你好，請問主機還在嗎, role: bubble, speaker: self}
    - {text: 在的，還沒賣出, role: bubble, speaker: other}
    - {text: 6500 可以嗎, role: bubble, speaker: self}
    - {text: 6600 就好，我這邊也是誠意賣, role: bubble, speaker: other}
    - {text: 好 那週六下午市府站可以嗎, role: bubble, speaker: self}
    - {text: 可以，兩點在出口見，當場驗機沒問題再給錢, role: bubble, speaker: other}

- id: e08_chat_to_line
  layout: chat
  variant: {width: 720, theme: light, quality: sharp}
  is_scam: true
  notes: 導流到 LINE。語料實測 57.2% 的案例走到 LINE，但起點在 Threads
  blocks:
    - {text: 賣家 票券小舖, role: title}
    - {text: 您好 我想買兩張, role: bubble, speaker: self}
    - {text: 好的！這邊訊息常常會漏掉, role: bubble, speaker: other}
    - {text: 麻煩加我們的 LINE 客服，訂單都在那邊處理, role: bubble, speaker: other}
    - {text: "ID：@demo-shop888（記得加 @）", role: bubble, speaker: other}
    - {text: 加好跟客服說「Threads 訂票」就可以了, role: bubble, speaker: other}

- id: e09_chat_kyc_block
  layout: chat
  variant: {width: 720, theme: light, quality: sharp}
  is_scam: true
  notes: 未完成實名制認證。這是本模組最關鍵的畫面，60 筆標準答案裡反覆出現
  blocks:
    - {text: 賣貨便客服, role: title}
    - {text: 您的訂單目前無法成立, role: bubble, speaker: other}
    - {text: "系統顯示：帳號未完成實名制認證", role: bubble, speaker: other}
    - {text: 我下單的時候沒有看到要認證, role: bubble, speaker: self}
    - {text: 這是今年新制，第一次交易都要驗證身分, role: bubble, speaker: other}
    - {text: "請先匯 5,000 元作為認證金，系統確認後會全額退回", role: bubble, speaker: other}
    - {text: 認證完成訂單就會自動出貨, role: bubble, speaker: other}

- id: e10_chat_repeat_pay
  layout: chat
  variant: {width: 720, theme: light, quality: sharp}
  is_scam: true
  notes: 以格式錯誤為由要求再匯一次。重複付款是階段判定的分界
  blocks:
    - {text: 賣貨便客服, role: title}
    - {text: 我已經匯了 5000, role: bubble, speaker: self}
    - {text: 收到了，但是您備註欄位填錯, role: bubble, speaker: other}
    - {text: 系統判定為異常匯款，這筆會被凍結, role: bubble, speaker: other}
    - {text: 那我的錢怎麼辦, role: bubble, speaker: self}
    - {text: 需要您再匯一次正確的金額做沖正, role: bubble, speaker: other}
    - {text: 兩筆都會在 24 小時內一起退還給您, role: bubble, speaker: other}

- id: e11_chat_netbank
  layout: chat
  variant: {width: 720, theme: light, quality: sharp}
  is_scam: true
  notes: 索取網銀帳密與驗證碼。交出帳戶控制權的典型畫面
  blocks:
    - {text: 金流客服專員, role: title}
    - {text: 退款要從您的網銀端解除限制, role: bubble, speaker: other}
    - {text: 請提供網銀帳號與登入密碼，我們代為操作, role: bubble, speaker: other}
    - {text: 這樣安全嗎, role: bubble, speaker: self}
    - {text: 我們是特約金流，全程有錄音, role: bubble, speaker: other}
    - {text: 等一下手機會收到一組驗證碼，請立刻告訴我, role: bubble, speaker: other}
    - {text: 那組碼只有 60 秒，過了就要重來, role: bubble, speaker: other}

- id: e12_chat_dark
  layout: chat
  variant: {width: 720, theme: dark, quality: sharp}
  is_scam: true
  notes: 深色模式。氣泡左右判定在深色下是另一組顏色條件，這正是要測的
  blocks:
    - {text: 客服中心, role: title}
    - {text: 請您下載遠端協助軟體，我們幫您設定, role: bubble, speaker: other}
    - {text: 安裝好之後點共享畫面，把代碼給我, role: bubble, speaker: other}
    - {text: 需要看到我的手機嗎, role: bubble, speaker: self}
    - {text: 是的，這樣才能確認您的操作沒有錯誤, role: bubble, speaker: other}
    - {text: 過程中請不要掛斷，也不要接其他來電, role: bubble, speaker: other}

- id: e13_chat_group
  layout: chat
  variant: {width: 720, theme: light, quality: sharp}
  is_scam: true
  notes: 多人群組的假買家見證。說明書說多發話人氣泡分群是全系統最難的
  blocks:
    - {text: 商城客戶服務群, role: title}
    - {text: 歡迎新加入的買家, role: bubble, speaker: other}
    - {text: 請依照客服指示完成認證就可以正常出貨, role: bubble, speaker: other}
    - {text: 我昨天認證完，今天貨就到了, role: bubble, speaker: other}
    - {text: 真的假的 我還在猶豫要不要匯, role: bubble, speaker: self}
    - {text: 我也是一開始怕怕的，後來錢真的有退回來, role: bubble, speaker: other}
    - {text: 不要拖太久 訂單會被系統取消, role: bubble, speaker: other}

- id: e14_chat_blurred
  layout: chat
  variant: {width: 720, theme: light, quality: blurred}
  is_scam: true
  notes: 手震拍糊。真實使用者上傳的就是這樣，不能只吃得下乾淨的圖
  blocks:
    - {text: 客服專員, role: title}
    - {text: 請您現在到附近的提款機前面, role: bubble, speaker: other}
    - {text: 到了跟我說，我一步一步帶您操作, role: bubble, speaker: other}
    - {text: 我到了, role: bubble, speaker: self}
    - {text: 請選擇英文介面，按其他服務, role: bubble, speaker: other}
    - {text: 然後輸入我給您的解除代碼, role: bubble, speaker: other}

- id: e15_chat_paycode
  layout: chat
  variant: {width: 720, theme: light, quality: sharp}
  is_scam: true
  notes: 要求出示付款碼並一筆一筆扣。損害最重的一步
  blocks:
    - {text: 認證客服, role: title}
    - {text: 最後一步要驗證您的行動支付, role: bubble, speaker: other}
    - {text: 請打開錢包 APP 的付款碼，截圖傳給我, role: bubble, speaker: other}
    - {text: 傳這個會被扣款嗎, role: bubble, speaker: self}
    - {text: 不會，這只是讀取用的條碼, role: bubble, speaker: other}
    - {text: 系統跑完會顯示幾筆小額紀錄，那是正常的驗證扣款, role: bubble, speaker: other}
    - {text: 請不要自行取消，會前功盡棄, role: bubble, speaker: other}

# ── 簡訊（2 張）────────────────────────────────────────

- id: e16_sms_order_alert
  layout: sms
  variant: {width: 720, theme: light, quality: sharp}
  is_scam: true
  notes: 訂單異常通知帶短網址。冒充超商取貨系統
  blocks:
    - {text: "+886 9XX-XXX-417", role: title}
    - {text: 【超商取貨通知】您的包裹因收件資料不符暫停配送, role: bubble, speaker: system}
    - {text: "請於今日 18:00 前完成資料更正，逾時將退回", role: bubble, speaker: system}
    - {text: "hxxps://reurl-example.tw/b3Qm7", role: bubble, speaker: system}
    - {text: 如有疑問請洽線上客服, role: bubble, speaker: system}

- id: e17_sms_bank_alert
  layout: sms
  variant: {width: 720, theme: light, quality: sharp}
  is_scam: false
  notes: 真的銀行通知。對照組——看起來很像詐騙但不是
  blocks:
    - {text: 示範商業銀行, role: title}
    - {text: 【重要通知】您的帳戶 ****3821 已列為警示帳戶, role: bubble, speaker: system}
    - {text: 相關款項業已暫停交易, role: bubble, speaker: system}
    - {text: 請本人攜帶雙證件親至原開戶分行辦理, role: bubble, speaker: system}
    - {text: 本行不會以電話或簡訊要求您提供密碼, role: bubble, speaker: system}

# ── 個人檔案與單據（3 張）──────────────────────────────

- id: e18_profile_seller
  layout: profile
  variant: {width: 720, theme: light, quality: sharp}
  is_scam: true
  notes: 賣家檔案。帳號剛建立、沒有評價、全是同款商品
  blocks:
    - {text: 精品代購小舖, role: title}
    - {text: "加入時間：3 天前", role: field}
    - {text: "追蹤者 12 人 / 貼文 47 篇", role: field}
    - {text: "評價：尚無", role: field}
    - {text: 全新正品代購，價格全網最低，誠信經營。, role: body}
    - {text: 私訊回覆最快, role: button}

- id: e19_shipping_receipt
  layout: product
  variant: {width: 720, theme: light, quality: low_res}
  is_scam: true
  notes: 賣家傳來的寄件單據，低解析度翻拍。用來讓買家相信貨已寄出
  blocks:
    - {text: 超商店到店 寄件單, role: title}
    - {text: "寄件編號：EX-000000000", role: field}
    - {text: "寄件人：林○○", role: field}
    - {text: "收件門市：示範門市", role: field}
    - {text: "收件人：陳○○", role: field}
    - {text: "內容物：3C 配件", role: field}
    - {text: 運費 60 元, role: price}

- id: e20_kyc_page
  layout: ad_post
  variant: {width: 720, theme: light, quality: sharp}
  is_scam: true
  notes: 假的認證頁。網址與版型模仿超商物流服務，實際是釣魚頁
  blocks:
    - {text: 會員實名制認證, role: title}
    - {text: "hxxps://demo-kyc-verify.tw/order", role: field}
    - {text: "訂單編號：DM-20260923-0071", role: field}
    - {text: "狀態：未完成實名制認證（交易凍結中）", role: field}
    - {text: "認證保證金：5,000 元", role: price}
    - {text: 依金融法規，首次交易之會員須完成身分驗證，保證金於認證完成後全額退還。, role: body}
    - {text: 前往認證, role: button}
