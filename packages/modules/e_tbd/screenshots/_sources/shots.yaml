# 模組 E 的 20 張模擬截圖定義（S11）
#
# 這份是唯一的資料來源：render.py 讀它產生 PNG，同時產生 annotations.yaml。
# 所以圖跟標註不可能對不上 —— 標註不是事後標的，是畫面本來就是照它畫的。
#
# 全部內容為虛構。公司名、人名、電話、帳號、網址都是編的，
# 沒有任何一個字來自真實案例（說明書 S11：絕對不要用真實受害者的截圖）。

- id: e01_jobpost_normal
  layout: ad_post
  variant: {width: 720, theme: light, quality: sharp}
  is_scam: false
  notes: 正常職缺。對照組——只餵詐騙樣本會讓模型看到職缺就報警
  blocks:
    - {text: 宏益文具行, role: title}
    - {text: 行政助理, role: title}
    - {text: "月薪 30,000 - 34,000 元", role: price}
    - {text: 台中市西區 / 全職 / 日班, role: field}
    - {text: 工作內容：文件建檔、電話接聽、簡易帳務整理。需熟 Excel。, role: body}
    - {text: 應徵條件：高中職以上，經驗不拘，具細心特質佳。, role: body}
    - {text: 我要應徵, role: button}

- id: e02_jobpost_suspicious
  layout: ad_post
  variant: {width: 720, theme: light, quality: sharp}
  is_scam: true
  notes: 高薪日領免經驗，沒有工作內容說明
  blocks:
    - {text: 誠徵 線上客服專員（急）, role: title}
    - {text: "日領 3,000 - 5,000 元", role: price}
    - {text: 不限地區 / 時間自由 / 在家可做, role: field}
    - {text: 免經驗！免學歷！當天面試當天上工！, role: body}
    - {text: 工作輕鬆簡單，只需協助處理公司訂單資料。, role: body}
    - {text: 意者請加 LINE 詳談, role: body}
    - {text: 加 LINE 詢問, role: button}

- id: e03_jobpost_detail
  layout: ad_post
  variant: {width: 720, theme: light, quality: sharp}
  is_scam: true
  notes: 結構化欄位齊全但公司資訊空泛。S11 要求抓職缺的結構化欄位
  blocks:
    - {text: 鑫達國際企業有限公司, role: title}
    - {text: 財務專員助理, role: title}
    - {text: "月薪 65,000 元起", role: price}
    - {text: 職務類別：財務／會計, role: field}
    - {text: 工作性質：全職, role: field}
    - {text: 上班地點：面議, role: field}
    - {text: 需求人數：不限, role: field}
    - {text: 學歷要求：不拘, role: field}
    - {text: 工作內容：協助公司資金調度與帳務往來，需配合公司流程操作。, role: body}
    - {text: 我要應徵, role: button}

