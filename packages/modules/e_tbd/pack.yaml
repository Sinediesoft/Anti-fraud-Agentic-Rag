# ═══════════════════════════════════════════════════════════════
#  模組 E — 起點在 Threads 的詐騙（主手法：網路購物）
#
#  題目依全量語料（194,355 筆）評估後決定，與說明書 §0.2 的分組表不同。
#
#  ── 為什麼是 Threads ──────────────────────────────────────
#  Threads 命中 12,743 筆（6.56%），平台排名第四。
#  模組邊界用「起點」定義，不是用「只出現這個平台」：
#    · Threads 關鍵字位置中位數 0.02，99.4% 落在案例前 20%（多為第一句）
#    · 兩平台都出現的 7,288 筆裡，99.5% 是 Threads 先出現
#  所以這 12,743 筆的起點都是 Threads，導流到 LINE（57.2%）是後續環節，
#  整條算這個模組。做 LINE 的人處理起點在 LINE 的案例，兩邊不衝突。
#
#  ── 為什麼主手法是網路購物 ───────────────────────────────
#  Threads 上網路購物類 9,191 筆，佔 72.1%——壓倒性第一，
#  與 Threads 以貼文帶貨為主的使用型態吻合。
#
#  ── 報告要注意 ───────────────────────────────────────────
#  熱度已過高峰：2025Q4 佔當季 13.86%（3,542 筆）為頂點，
#  2026Q3 降到 5.16%（1,084 筆），絕對筆數掉 69%，同期全體只掉 18%。
#  **不能寫成「Threads 是當前最嚴重的平台」，數據會反駁。**
#
#  接下來要改的地方：
#    1. S10 標 60 筆標準答案（現有 40 題評估集要擴到 60–80）
#    2. S12 knowledge_refs 的條號與版本日期
#    3. 人工複核 300 筆，量測平台推導規則的精確率（docs/資料來源.md 要求）
#    4. 資料夾改名 e_tbd → e_threads_shopping，並同步 team.yml 與 CODEOWNERS
#       （那兩個是共用檔案，要跟全隊講一聲再動）
# ═══════════════════════════════════════════════════════════════
