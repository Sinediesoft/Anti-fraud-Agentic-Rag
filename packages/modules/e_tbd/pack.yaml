# ═══════════════════════════════════════════════════════════════
#  模組 E — 求職平台 × 人頭帳戶
#
#  題目已於 2026-09-20 用真實語料確認，與說明書 §0.2 的分組表不同，理由如下。
#
#  說明書寫「E：求職平台 × 人頭帳戶，2,642 筆」，但那是提案階段的估計。
#  語料落地後（194,355 筆）實際統計：
#
#    假求職詐騙 + 變體      4,998 筆   求職平台命中 65%
#    騙取金融帳戶(卡片)+變體  5,393 筆   求職平台命中  4%
#    假借銀行貸款 + 變體     6,674 筆   求職平台命中  0%
#
#  「假貸款」與「騙取金融帳戶」跟求職平台幾乎無關，硬套進「求職平台 × X」
#  會讓模組名實不符。所以這個模組收斂為**假求職詐騙這一個手法，不限平台**——
#  4,998 筆遠高於 2,000 筆門檻，而且是官方認定的獨立分類。
#
#  跨平台是這個手法的本質，不是切得不夠細：假求職案例同時命中
#  社群平台 61%、通訊軟體 62%，典型路徑是「社團看到職缺 → 加 LINE 談」。
#
#  ⚠ 假貸款 6,674 筆（全體第 13 大手法）目前沒有模組認領，要跟全隊確認。
#
#  接下來要改的地方（照順序）：
#    1. S9  抽 30 筆親自讀完，用真實話術校正 route_terms / platform_terms
#    2. S10 標 60 筆標準答案，其中 20 筆當 S12 的搜尋考題
#    3. S12 knowledge_refs 的條號與版本日期
#    4. S14 playbook.yaml 的階段與行動清單以真實案例校正
#    5. 資料夾改名 e_tbd → e_fake_job，pack.yaml 的 id 要跟著改，
#       並同步 .github/team.yml 與 .github/CODEOWNERS 的路徑
#       （那兩個是共用檔案，要跟全隊講一聲再動）
# ═══════════════════════════════════════════════════════════════
id: e_tbd
code: "E"
name: 假求職詐騙
owner: c85016921920-design
version: "0.1.0"
plan: paid

# 不限單一平台：這個手法橫跨人力銀行、社群社團與通訊軟體，
# 交叉表證實三者命中率都在六成上下
platform: 求職管道（跨平台）
tactic: 假求職詐騙

# 正規化後的標準名稱
labels_canon:
  - 假求職詐騙

# 官方原始的各種寫法。說明書 S9 提醒 E 有「帶著多餘空白的變體」——
# 實際撈出來 6 種，其中 4 種是格式變體，合計 8 筆，不處理就會漏掉
label_aliases:
  - 假求職詐騙        # 4,545 筆
  - 假求職            #   445 筆
  - "假求職詐騙\n"     #     3 筆
  - "假求職詐騙 "      #     3 筆
  - "假求職 "         #     1 筆
  - "\n \t\n假求職詐騙"  #     1 筆

# 受害者怎麼講「找工作」這件事。
# 括號內為 2026-09-20 從 4,998 筆真實案例算出的（出現率 / lift）。
platform_terms:
  - 求職            # 43.0% / 172
  - 工作機會        # 32.3% / 431
  - 找工作          # 21.8% / 103
  - 兼職            # 15.7% /  18
  - 人力銀行
  - 求職網
  - 職缺
  - 應徵
  - 面試
  - 履歷
  - 打工
  - 日領

# 話術詞彙。括號內為從真實案例算出的（出現率 / lift），不是猜的。
#
# ⚠ 最大的發現：「家庭代工」佔 27.9%，是這一類的主要子型，
#    而初版詞表完全沒有它——只憑對「人頭帳戶」的想像寫詞表會漏掉四分之一的案例。
route_terms:
  # 家庭代工型（S9 統計才發現的子型）
  - 家庭代工        # 27.9% / 186
  - 代工            # 32.9% / 139
  - 材料            # 17.2% / 172
  # 帳戶交付型
  - 提款卡          # 19.9% /   5
  - 金融卡          # 21.4% /   3
  - 存摺
  - 網銀
  - 薪轉
  - 帳戶
  - 密碼
  - 驗證碼
  # 後段：帳戶已被使用
  - 警示            # 34.8% /   5
  - 寄出            # 22.1% /   3
  # 初版保留，出現率低但語意精準
  - 代收
  - 代轉
  - 走帳
  - 資金調度
  - 超商店到店

# 出現就要扣分的詞，用來跟隔壁模組分開。
# B／C 是投資、D 是釣魚、A 是網購——這些情境不該被 E 搶走。
negative_terms:
  - 投資
  - 入金
  - 出金
  - 老師
  - 帶單
  - 交友
  - 約會
  - 中獎
  - 賣家
  - 買家
  - 蝦皮

# TODO(S12)：條號與版本日期都要查證後才算數（說明書：沒寫日期等於沒有出處）。
# 這三條是說明書 S12 為 E 指定的。E 的使用者處境跟其他四組不同——
# 他可能同時是被害人與被調查的對象，需要的是幫助詐欺與洗錢防制法，
# 把詐欺犯罪危害防制條例丟給他是答非所問。
knowledge_refs:
  - title: 中華民國刑法
    article: 第 30 條
    version_date: ""
    note: 幫助犯。TODO(S12) 查證版本日期
  - title: 洗錢防制法
    article: 第 15 條之 2
    version_date: ""
    note: 無正當理由交付帳戶。TODO(S12) 查證版本日期
  - title: 存款帳戶及其疑似不法或顯屬異常交易管理辦法
    article: ""
    version_date: ""
    note: 警示帳戶的處理依據。TODO(S12) 確認正式名稱、條號與版本日期

thresholds:
  route_min: 0.55       # TODO(S18)：調路由時依混淆矩陣回來調
  route_hint_min: 0.35
priority: 50            # A=10。E 排在後面，分數打平時讓位給件數大的組

deliverables:
  m1: m1_corpus.py
  m2: m2_vision.py
  m3: m3_retrieval.py
  m4: m4_judgement.py
  m5: m5_agent.py
  playbook: playbook.yaml
  report: REPORT.md

stats:
  # m1_corpus.py 實際切出來的數字（2026-09-21）
  total_cases: 4973        # 標籤命中 4,998，內文去重後 4,973（重複 25 筆）
  platform_cases: 3770     # 其中提到求職管道的（76%）
  # 注意：3,770 用的是未經驗證的關鍵詞規則。
  # 說明書 S6 第 6 點要求人工複核 300 筆量測準確率，那還沒做。
