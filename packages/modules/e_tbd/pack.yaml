# 平台詞。「脆」只收精確樣態——實測明確指 Threads 的 73 筆，
# 誤中（脆弱／乾脆／酥脆／清脆）1,167 筆，直接收會引入 16 倍雜訊。
platform_terms:
  - Threads
  - threads
  - 脆上
  - 在脆
  - 脆友
  - 脆的貼文

# 話術詞。括號內為 Threads 網購案例 vs 非 Threads 案例的（出現率 / lift），
# 2026-09-22 從 5,000 筆實測。
#
# 選詞標準是**區分性**不是命中率。「客服」出現率 66% 但 lift 只有 2.8——
# 每種詐騙都會提到客服，收它只會把別人的案子搶過來。
# 真正的招牌話術是「未完成實名認證」與「賣貨便」，那是這一類特有的。
route_terms:
  # 決定性訊號：正規超商物流沒有「實名認證」這道手續
  - 未完成          # 29.1% / 8.9
  - 賣貨便          # 37.1% / 7.9
  - 實名認證        # 30.0% / 7.6
  - 完成實名        # 32.8% / 6.7
  - 實名制
  - 交貨便
  - 認證失敗
  - 認證            # 60.3% / 4.5 —— 覆蓋最廣的變體，受害者未必講全「實名認證」
  - 實名            # 51.9% / 5.8 —— 受害者常只講「實名」或「實名驗證」
  # 假客服。原本刻意只收「線上客服」因為「客服」lift 只有 2.7，
  # 但那讓覆蓋率 67% 的詞整個落榜——20 題路由考題有 4 題因此掛零。
  # negative_terms（投資／應徵／交友…）已能擋住隔壁模組，所以收進來。
  - 線上客服        # 30.4% / 5.6
  - 客服            # 67.0% / 2.7
  - 驗證            # 42.0% / 2.9
  # 交易環節
  - 下單            # 32.4% / 4.9
  - 訂金
  - 店到店
  - 賣家            # 33.4% / 2.8
  - 私訊            # 32.2% / 3.0
  - 貼文            # 27.0% / 3.4
  - 販售            # 21.8% / 2.6
  # 後段：帳戶控制權與資金流出。這批是 2026-09-22 從 S10 的 60 筆 gold
  # 反推出來的——原本只憑印象列，漏掉了實際案例最常出現的講法。
  - 驗證碼
  - 共享畫面
  - 分享螢幕        # 字序相反的寫法，gold 裡兩種都有
  - 螢幕分享
  - 無卡提款        # 一般網購不會要你開這個功能
  - 付款碼
  - 網路銀行        # 25.4% / 3.5
  - 提款            # 23.6% / 2.5
  - 金流
  - 盜刷

# 出現就扣分，用來跟隔壁模組分開
negative_terms:
  - 應徵
  - 面試
  - 履歷
  - 職缺
  - 投資
  - 入金
  - 出金
  - 帶單
  - 交友
  - 約會

