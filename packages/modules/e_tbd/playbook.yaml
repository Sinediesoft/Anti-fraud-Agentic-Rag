# 行動劇本 — 模組 E（求職平台 × 人頭帳戶）
#
# TODO(S14)：這是依說明書對 E 的描述寫的初版骨架。S9 讀完 30 筆真實案例、
#            S10 標完 60 筆之後要回來校正——階段的切法與 cues 都要以語料為準。
#
# 這一組跟另外四組有一個根本差異：使用者交出帳戶之後，他同時是被害人，
# 也可能成為被調查的對象（說明書 S12 指定的法條是幫助詐欺與洗錢防制法，
# 不是詐欺犯罪危害防制條例）。所以行動清單除了止損，還要處理證據保全與法律協助。
#
# 界線：這裡只給「該去哪、該做什麼」，不做任何法律判斷。
#       系統不能告訴使用者他有沒有罪、會不會被起訴——那是司法程序的事。

stages:
  - id: recruited
    name: 剛看到職缺或剛被招募
    risk: low
    explanation: >-
      你還沒有提供任何證件或帳戶。這是最好處理的時間點，現在退出不會有任何損失。
    cues: [看到職缺, 應徵, 面試, 打工, 兼職, 日領, 高薪, 輕鬆, 招募, 加賴]
    actions:
      - text: 用公司全名到經濟部商業司的商工登記查詢，確認這家公司真的存在、負責人是誰。
        urgency: today
        why: 人頭帳戶的招募方多半沒有可查的登記，或用的是別人的公司名義。
      - text: 先不要提供身分證、存摺、提款卡的照片，正常求職在這個階段不需要這些。
        urgency: now
        why: 個人證件一旦交出去就收不回來，而且可能被用來開更多帳戶。

  - id: documents_requested
    name: 被要求提供證件或個資
    risk: medium
    explanation: >-
      對方要你先拍身分證、存摺封面或健保卡。合法的雇主要到報到那天、
      在正式簽約時才需要這些，而且是你本人到場交付，不會用通訊軟體收。
    cues: [身分證, 存摺封面, 健保卡, 拍照, 傳照片, 雙證件, 建檔, 做資料]
    actions:
      - text: 現在停止提供，不要再傳任何證件照片。
        urgency: now
        why: 對方通常會從證件開始，一步一步要到帳戶。停在這裡損失最小。
      - text: 已經傳出去的，把對話紀錄與傳出的內容截圖保留，不要刪除也不要封鎖對方。
        urgency: now
        why: 之後不論是報案還是說明自己的情形，這些是唯一能證明過程的東西。
      - text: 撥打 165 說明對方要了哪些資料，確認這個招募是不是詐騙。
        urgency: today

  - id: account_requested
    name: 被要求交出帳戶
    risk: high
    explanation: >-
      對方要你的提款卡、網銀帳號密碼，或要你去開新帳戶、辦新的薪轉戶。
      這是整個流程最關鍵的一步——帳戶一旦交出去，它被拿去收詐騙款項，
      你的名字就會出現在別人的匯款紀錄上。
    cues: [提款卡, 金融卡, 存摺, 密碼, 網銀, 驗證碼, 薪轉戶, 開戶, 寄出, 店到店, 代收, 走帳]
    actions:
      - text: 不要寄出提款卡、不要告知密碼或驗證碼，包含對方說「只是驗證一下」的那次。
        urgency: now
        why: 沒有任何一種合法工作需要員工交出自己的金融卡或網銀密碼。
      - text: 如果已經去辦了新帳戶但還沒交出去，先不要交，把卡與存摺留在自己身上。
        urgency: now
      - text: 撥打 165 說明現在的情況，並保留所有對話紀錄與對方帳號。
        urgency: now
        why: 在帳戶還沒被使用前主動聯繫，處理空間比事後大得多。

  - id: account_handed
    name: 帳戶已經交出去了
    risk: critical
    explanation: >-
      帳戶已經在對方手上，可能正在被用來收受款項。現在最重要的兩件事是
      讓帳戶停止運作，以及把整個過程記錄下來。
    cues: [已經寄, 寄出去了, 給他了, 交出去, 被領走, 有錢進來, 匯進來, 幫忙領]
    actions:
      - text: 立刻聯繫你的往來銀行辦理掛失或止付，讓那張卡與帳戶無法再被使用。
        urgency: now
        why: 帳戶還在運作，受害款項就會持續匯進來，牽涉的範圍會一直擴大。
      - text: 撥打 165，並到警察機關說明你遇到的情況、帳戶是在什麼情形下交出去的。
        urgency: now
        why: 主動說明與被動被查到，在後續處理上是不同的起點。
      - text: 不要再依照對方指示提領、轉帳或把錢交給任何人，即使對方說是要退還給你。
        urgency: now
        why: 提領與轉交是這類案件中風險最高的動作。
      - text: 完整保留招募貼文、對話紀錄、匯款紀錄、寄件單據與對方帳號，不要刪除。
        urgency: now
        why: 這些是說明你自己處境時唯一的依據。

  - id: account_flagged
    name: 帳戶被警示，或已收到銀行、警方通知
    risk: critical
    explanation: >-
      帳戶已經被列為警示帳戶，或你已經收到通知書。這個階段會進入正式程序，
      重點是完整說明經過，以及取得專業的法律協助。
    cues: [警示帳戶, 凍結, 通知書, 傳票, 約談, 做筆錄, 分局, 地檢署, 被告]
    actions:
      - text: 不要迴避通知，依通知上的時間與地點前往，並在事前整理好完整的時間順序。
        urgency: today
        why: 未到場不會讓程序停止，只會讓你失去說明的機會。
      - text: >-
          聯繫法律扶助基金會（412-8518）詢問能否申請扶助律師，
          在正式說明之前先取得專業意見。
        urgency: today
        why: 這個階段的問題已經超出詐騙判讀的範圍，需要的是法律專業。
      - text: 把所有證據整理成一份時間順序：什麼時候看到職缺、對方要了什麼、什麼時候交出去。
        urgency: today
        why: 清楚的時間順序，是說明自己處境時最有力的材料。
      - text: 仍然要撥打 165 完成報案，你同時也是這起詐騙的被害人。
        urgency: today

# 沒有命中任何階段時的回應。E 這組尤其需要——
# 使用者常常是在「說不出自己算不算被騙」的狀態下來的。
fallback:
  risk: unknown
  explanation: >-
    依你描述的內容，還無法判斷你走到哪一個階段。如果你正在應徵的工作
    提到要提供存摺、提款卡、網銀密碼，或要你代收、代轉款項，
    請先停止提供，並撥打 165 說明情況。
  actions:
    - text: 撥打 165 反詐騙諮詢專線說明你的情況。
      urgency: now
