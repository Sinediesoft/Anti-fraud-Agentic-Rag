# 行動劇本 — 模組 E（起點在 Threads 的網路購物詐騙）
#
# 階段用「損失到哪一步」切，不是用「流程走到第幾階」。
# 理由見 threads_stages.py 的檔頭：判定是不是詐騙、跟已經損失多少，
# 是兩個獨立維度，壓成單一風險分數會出現「已經把錢匯給陌生人卻顯示低風險」的矛盾。
#
# 這五個 id 對應 threads_stages.Harm 的五個值，m4_judgement 依 assess() 的結果選。
# 行動清單取自 threads_stages.SHOPPING.actions，兩邊要一起改。
#
# ⚠ 沒有「安全」這個階段。語料 194,355 筆全部是詐騙報案，一筆正常交易都沒有，
#   系統沒有資格說任何情況安全。訊號不足時走 fallback，要求補充細節。
#   所以最低風險等級是 medium，不是 low。

stages:
  - id: none
    name: 尚未付款
    risk: medium
    explanation: >-
      你還沒有付出金錢。這是最好處理的時間點，現在退出不會有任何損失。
    cues: [看到, 刷到, 滑到, 貼文, 私訊, 下單, 訂購, 談好]
    actions:
      - text: 先不要付錢，也不要離開平台交易。轉到 LINE 之後就沒有紀錄可以申訴。
        urgency: now
        why: 把交易帶離平台，就沒有任何紀錄可以申訴。
      - text: 查對方帳號的建立時間、貼文歷史與追蹤者。新開帳號、貼文稀少要特別小心。
        urgency: now
      - text: 價格明顯低於市價是最強的警訊。
        urgency: now
      - text: 堅持使用平台內建或有第三方保障的付款方式，不要匯到個人帳戶。
        urgency: today

  - id: paid
    name: 已付款一次
    risk: high
    explanation: >-
      你已經付出第一筆錢。接下來最關鍵的是不要付第二筆——
      語料顯示大額損失幾乎都發生在第二次付款之後。
    cues: [匯款, 轉帳, 付款, 訂金, 匯了, 付了]
    actions:
      - text: >-
          不要再付第二筆。接下來若出現「認證失敗」「訂單卡住」「要補手續費」，
          那都是話術。
        urgency: now
        why: 語料顯示大額損失幾乎都發生在第二次付款之後。
      - text: 保留全部對話紀錄、匯款單據與對方帳號截圖。
        urgency: now
      - text: 打 165 說明狀況，並聯繫你的銀行。
        urgency: now
      - text: 若是超商賣貨便交易，直接打超商官方客服查證訂單是否真的存在。
        urgency: today
        why: 正規超商物流沒有「實名認證」這道手續。

  - id: repeated
    name: 已重複付款
    risk: high
    explanation: >-
      對方已經讓你付了不只一次。這種模式會持續下去，直到你停手為止——
      每一次都會有新的理由。
    cues: [又匯, 再匯, 第二次, 兩次, 補繳, 手續費, 保證金]
    actions:
      - text: 立刻停止，不要再匯任何一筆。對方會持續用新理由要求付款，直到你停手為止。
        urgency: now
        why: 被要求再付一次——語料顯示大額損失幾乎都發生在第二次付款之後。
      - text: 打 165，並聯繫銀行說明遭詐，詢問能否對收款帳戶通報。
        urgency: now
      - text: 整理兩次匯款的時間、金額、收款帳號，報案時會需要。
        urgency: today
      - text: 不要接受「全額退款但要先付保證金」這種說法，那是第三次。
        urgency: now

  - id: credentials
    name: 已交付帳戶控制權
    risk: critical
    explanation: >-
      你已經提供了驗證碼、網銀密碼，或依指示操作過 ATM、安裝過遠端軟體。
      帳戶現在可能不在你的控制之下，重點是立刻切斷。
    cues: [驗證碼, OTP, 網銀, ATM, 共享畫面, 遠端, 下載, 提款卡, 存摺]
    actions:
      - text: >-
          立刻打你銀行卡背面或官網上的客服電話（不要用對方給的號碼）辦理停卡與圈存。
        urgency: now
        why: 對方提供的號碼可能就是假客服。
      - text: 變更網銀密碼與相關帳號密碼。
        urgency: now
      - text: 若曾開啟遠端或畫面分享，移除該軟體並檢查裝置。
        urgency: now
      - text: 打 165，說明帳戶可能已被操作。
        urgency: now
      - text: >-
          若提款卡或存摺已寄出，一併向銀行與警方說明——帳戶可能被用作人頭戶。
        urgency: now
        why: 這會讓你同時涉及另一個法律問題，主動說明比被查到好。

  - id: drained
    name: 資金已遭轉出
    risk: critical
    explanation: >-
      帳戶已經發生非自願的資金異動。現在每一分鐘都影響能不能攔下還沒被提走的錢。
    cues: [轉出, 盜刷, 扣款, 遭轉, 被轉走, 被領走]
    actions:
      - text: 現在就打銀行客服辦理圈存與停卡，號碼用卡片背面或官網的。
        urgency: now
        why: 圈存越早越有機會攔下還沒被提走的錢。
      - text: 打 165，說明資金已遭轉出。
        urgency: now
      - text: 帶對話紀錄、匯款單據到警察局報案，取得受理案件證明。
        urgency: today
      - text: 變更所有相關密碼；曾開啟遠端的裝置要檢查。
        urgency: now
      - text: 向銀行詢問能否對收款帳戶申請圈存——越早通報，攔截機會越高。
        urgency: now

# 訊號不足時的回應。注意措辭：不是「你沒事」，是「資訊不夠判斷」。
fallback:
  risk: unknown
  explanation: >-
    依你描述的內容，還無法判斷你走到哪一步。如果你是在 Threads 看到貼文後
    私訊交易，對方要求你到別的通訊軟體談、或提到「實名認證」「訂單異常」
    需要聯繫客服，那都是詐騙話術——正規超商物流沒有這道手續。
  actions:
    - text: 撥打 165 反詐騙諮詢專線說明你的情況。
      urgency: now
