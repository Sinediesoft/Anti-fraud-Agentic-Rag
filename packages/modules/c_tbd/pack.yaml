# 模組 C：Facebook × 投資詐騙
#
# 從另一個本機 repo（防詐騙 chat-bot）移植而來，見 README.md 的移植計畫。
# 那套的 investment.toml（飆股群組／老師帶單）正好是這條路徑的下半段：
# FB 廣告或社團接觸 → 導流到 LINE 群組 → 老師帶單 → 假平台出不了金。
id: c_tbd
code: "C"
name: Facebook 投資詐騙
owner: a24209422
version: "0.1.0"
plan: paid

platform: Facebook
tactic: 投資詐騙

# 165 的官方標籤用語。labels_canon 是切語料時比對的正規值，
# label_aliases 是使用者與語料裡會出現的其他說法。
labels_canon:
  - 假投資
label_aliases:
  - 投資詐騙
  - 假投資詐騙
  - 虛擬貨幣投資詐騙
  - 期貨投資詐騙
  - 飆股
  - 帶單

# 「我的平台」怎麼認。FB 的難處是使用者很少寫全名 ——
# 寫「臉書」「FB」「社團」「粉專」的比寫 Facebook 的多。
platform_terms:
  - Facebook
  - facebook
  - FB
  - fb
  - 臉書
  - 粉專
  - 粉絲專頁
  - 社團
  - 一頁式廣告

# can_handle() 的加分詞：出現這些字就比較可能是我這一類
route_terms:
  - 投資
  - 飆股
  - 明牌
  - 帶單
  - 老師
  - 分析師
  - 股票
  - 期貨
  - 虛擬貨幣
  - 加密貨幣
  - USDT
  - 泰達幣
  - 出金
  - 入金
  - 獲利
  - 報酬率
  - 保證獲利
  - 內線
  - 投資平台
  - APP儲值
  # 下面這幾個是實跑路由後補的。典型案例「我在臉書看到投資廣告加了 LINE
  # 群組結果出不了金」原本只拿 0.48，低於 route_min 0.55 —— 最典型的一種
  # 案子反而不被認領。原因是純子字串比對：「出不了金」裡沒有「出金」。
  # 這類否定／插字的變形要各自列，不能指望詞幹比對。
  - 出不了金
  - 無法出金
  - 無法提領
  - 提領
  - 投資廣告
  - 投資群組

# 扣分詞：出現這些字多半是別人的類型，不要搶
#
# ⚠ 這份清單要跟著全隊的分工長。E 已佔走「求職平台 × 人頭帳戶」，
#   所以車手、代收這些要扣分 —— 來源那套的 job.toml 跟 E 重疊，不移植。
negative_terms:
  - 求職
  - 打工
  - 車手
  - 人頭帳戶
  - 面試
  - 交友
  - 約會
  - 檢警
  - 地檢署
  - 監管帳戶
  - 包裹
  - 解除分期
  - 中獎

knowledge_refs:
  - title: 中華民國刑法
    article: 第 339 條
    version_date: "2019-05-29"
    note: 普通詐欺罪
  - title: 證券投資信託及顧問法
    article: 第 107 條
    version_date: "2018-01-31"
    note: 未經許可經營證券投資顧問業務 —— 「老師帶單」多半落在這條

thresholds:
  route_min: 0.55
  route_hint_min: 0.35

# 數字越小越優先。900 是範本的值，這裡沿用 —— 五個模組的優先序
# 要等 S6 決議平台分工之後才排得出來。
priority: 900

deliverables:
  m1: m1_corpus.py
  m2: m2_vision.py
  m3: m3_retrieval.py
  m4: m4_judgement.py
  m5: m5_agent.py
  playbook: playbook.yaml
  report: REPORT.md

stats:
  total_cases: null # S9 第 4 點：這個手法總共幾筆
  platform_cases: null # 其中在我的平台上的幾筆
