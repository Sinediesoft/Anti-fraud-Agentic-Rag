# ═══════════════════════════════════════════════════════════════
#  模組 D — 超商店到店物流 × 假冒物流平台客服（實名認證話術）
#
#  ── 這個模組跟別人不一樣的地方 ───────────────────────────
#  它不判斷對方是不是壞人，只比對「官方流程有沒有這一步」。
#  地基是刑事警察局 115-05-17 公告的標題本身：
#    〈賣貨便需要實名認證？！千萬別信假客服〉
#  防詐要點第三條白紙黑字：「賣貨便無需實名認證、金流簽署」。
#  所以輸出不是「我覺得像詐騙」，是「哪個機關、哪一天、說過這一步不存在」。
#
#  ── 🔴 待全隊決議：與模組 E 的邊界重疊 ───────────────────
#  E（Threads × 網路購物）的 route_terms 目前含「賣貨便 / 實名認證 /
#  完成實名 / 未完成 / 認證失敗 / 交貨便 / 店到店」，那正是本模組的招牌話術。
#  兩邊的定義軸不同：E 用「起點平台」，D 用「手法」。
#  刑事局公告明寫接觸管道是 Facebook、Threads、Instagram、Dcard —— 也就是說
#  Threads 只是本手法的入口之一，兩邊在「起點在 Threads 的賣貨便案」上會重疊。
#  → 已在本 PR 提出，請 E 一起決定切法。在決議前本模組照 team.yml 登記的
#    「手法軸」界定範圍，不縮小也不擴張。
#
#  ── 接下來要補的 ─────────────────────────────────────────
#    W2  M1 切語料，回填 stats 兩個數字並覆核 labels_canon
#    W2  route_terms 的區辨力用新語料重跑一次
#    W3  knowledge_refs 的 K7 補發布日期、K3 找到第一手新聞稿
# ═══════════════════════════════════════════════════════════════
id: d_tbd
code: "D"
name: 超商物流假冒客服詐騙
owner: door410
version: "0.2.0"
plan: paid

platform: 超商店到店物流
tactic: 假冒物流平台客服（實名認證話術）

# 標籤軸：網購交易四個標籤，語料實測 total_cases 62,395 筆。
# 🔴 四個缺一不可 —— 標籤漂移是實測確認過的事實：
#   「假買家騙賣家」2025:2,787 → 2026:249（掉九成）
#   「網路購物詐騙」2025:4,916 → 2026:2,749
#   案件沒有消失，是被改標了。只收其中一個，2026 年的資料會整片不見。
# TODO(W2)：M1 切語料時覆核這四個標籤的實際筆數。
labels_canon:
  - 網路購物詐騙
  - 假買家騙賣家詐騙
  - 假網拍詐騙
  - 解除分期付款(騙買家)詐騙

# 官方原始寫法的變體。165 的 label 欄不是受控分類（實測 1,003 種值），
# 所以比對用子字串不是等值，而且要先正規化全形括號與換行。
label_aliases:
  - 假買家騙賣家
  - 假網拍
  - 解除分期付款(騙買家)
  - 解除分期付款（騙買家）詐騙
  - 解除分期付款(騙賣家)詐騙
  - 假消費異常詐騙(騙買家)
  - 假交易異常詐騙(騙賣家)
  - 網路購物

# 平台詞：切語料要用。實測「超商物流」命中 18,222 筆、只佔母體 9.4% ——
# 平台軸很乾淨（對照 LINE 42.0%、臉書 27.2%，那兩個切不開任何東西）。
#
# 🔴 刻意不含「臉書 / Facebook」：那個平台留給模組 C。
# 🔴「交貨便」「店到店」留在這裡但絕對不進 route_terms，理由見下。
platform_terms:
  - 賣貨便
  - 交貨便
  - 好賣+
  - 好賣加
  - 店到店
  - 超商取貨
  - "7-11"
  - "711"          # 要加引號，不然 YAML 會讀成數字，PackSpec 驗證會擋下來
  - 統一超商
  - 全家
  - myship
  - 宅配通

# 路由詞：決定「這案子是不是我的」。
# 2026-09-21 實測，區辨力＝正例命中率 − 負例命中率，收 ≥ +0.15 的
# （掃了 54 個候選，13 個及格）。
route_terms:
  - 客服            # 正 84.6% / 負 30.9%  +0.54  ← 最強
  - 連結            # 正 74.4% / 負 27.6%  +0.47
  - 賣貨便          # 正 79.9% / 負 37.9%  +0.42
  - 認證            # 正 60.6% / 負 20.6%  +0.40  ← 覆蓋最廣，未必講全「實名認證」
  - 實名            # 正 54.1% / 負 14.9%  +0.39
  - 驗證            # 正 57.0% / 負 19.3%  +0.38
  - 賣家            # 正 46.2% / 負 10.1%  +0.36
  - 轉帳            # 正 50.2% / 負 17.7%  +0.33
  - 下單            # 正 38.1% / 負  7.1%  +0.31
  - 線上客服        # 正 35.4% / 負  7.7%  +0.28
  - 實名制          # 正 31.7% / 負  5.7%  +0.26
  - 未完成          # 正 30.7% / 負  5.9%  +0.25
  - 買家            # 正 26.8% / 負  7.8%  +0.19
  # 以下三個語料量不到門檻，但刑事局公告點名，屬於「只能從公告進系統」那一軸：
  - 金流簽署        # 公告原文用詞，正常流程不存在這道手續
  - 無卡提款        # 公告點名的指示動作
  - 付款碼          # 公告點名：誘騙翻拍／轉傳 QR Code 付款碼

# 🔴 最重要的坑：「交貨便」區辨力是 −0.35、「店到店」是 −0.10。
#    原因是「寄提款卡給詐騙集團」那類案子大量使用交貨便／店到店，
#    這兩個詞在別人的手法裡比在我的手法裡更常出現。
#    收進 route_terms 會讓路由把別人的案子搶過來 —— 所以只留在 platform_terms。

# 出現就扣分，用來跟隔壁模組分開。
# 投資軸擋 A（LINE 假投資）與 C（Facebook 投資詐騙），求職軸擋人頭帳戶類。
negative_terms:
  - 投資
  - 帶單
  - 老師
  - 飆股
  - 明牌
  - 分析師
  - 保證獲利
  - 出金
  - 入金
  - 虛擬貨幣
  - 加密貨幣
  - 交友
  - 約會
  - 應徵
  - 面試
  - 履歷
  - 職缺

# 官方出處。規矩是「沒寫日期等於沒有出處」。
# 全部出自《模組D_官方出處查證報告.md》，查證日期 2026-09-21，每條都有網址。
knowledge_refs:
  - title: 內政部警政署刑事警察局 公告事項
    article: 〈賣貨便需要實名認證？！千萬別信假客服〉
    version_date: "2026-05-17"
    note: >-
      K1★最重要。更新 2026-05-18。防詐要點第三條「賣貨便無需實名認證、金流簽署」
      是本模組的黃金規則；第四條「真客服不會加 LINE，更不會開視訊」。
      公告同時描述完整手法鏈與同步情緒勒索。
      https://www.cib.npa.gov.tw/ch/app/news/view?module=news&id=1887
  - title: 7-ELEVEN 賣貨便 最新資訊
    article: 〈【防詐提醒】詐騙集團常利用不同方式詐騙買賣家〉
    version_date: "2022-12-05"
    note: >-
      K2。官方客服不會以連結或 QR CODE 請賣家加入；官方 LINE 為藍色盾牌認證帳號
      @myship711，非個人帳號。假帳號常見名稱：賣貨便、7-ELEVEN客服專員、
      7-ELEVEN授權簽署中心、在線客服服務中心。
      https://myship.7-11.com.tw/Home/NewsList
  - title: 7-ELEVEN 交貨便 官方服務說明 Q&A
    article: 寄件、取件與賣家收款的正常流程
    version_date: "2026-09-21"
    note: >-
      K4。正常流程的權威版本，可直接當 RAG 的第二種語料。
      整份 Q&A 沒有任何一項需要線上「實名認證」或付費解鎖。
      version_date 為本次查證日（頁面持續更新、未標版本）。
      https://myship2.7-11.com.tw/Home/Service
  - title: 7-ELEVEN 賣貨便 幫助中心（金流相關）
    article: 信用卡／icash Pay 服務開通與撥款規則
    version_date: "2024-12-01"
    note: >-
      K5。🔴 修正一個常見誤解：賣貨便「真的有」開通金流服務，由藍新科技與愛金卡
      提供，但一律在平台內申請；服務費 2%／2.2% 從撥款中扣除，從來不需要賣家先匯錢。
      詐騙話術是借用真實名詞，所以聽起來合理 —— 這解釋了受害者為什麼會信。
      https://myship.7-11.com.tw/Home/HelpCenter
  - title: 7-ELEVEN 賣貨便 疑似詐騙案件申報
    article: 申訴止付機制
    version_date: "2026-09-21"
    note: >-
      K6。行動劇本可直接引用的官方止損程序：取件完成後 24 小時內申訴止付
      （週三／週日取件者最慢隔日 09:30 前），需附報案證明單，7 日內未補件自動撥款。
      version_date 為本次查證日。
      https://myship.7-11.com.tw/fraud/page
  - title: 中華民國刑法
    article: 第 339 條
    version_date: "2019-05-29"
    note: 普通詐欺罪。版本日期沿用 c_tbd/pack.yaml，TODO(W3) 自行覆核現行版本。

