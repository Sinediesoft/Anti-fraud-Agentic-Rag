#      🔴 在向 7-11 確認完整官方帳號清單之前，不可以拿「官方 LINE 帳號」當判準。

thresholds:
  # 2026-09-23 實測（自己 20 題 ＋ 別人的考題當負例）：
  #   0.45 → 自己 20/20 通過；誤報 A 0/20、C 0/2、E 9/20
  #   0.55 → 自己只剩 9/20（12 題 plain 全部落在 0.500，整批陣亡）
  # 取 0.45。E 那 9 題不是門檻問題 —— 那些題目描述的就是本模組的手法，
  # 是題目歸屬要跟 E 談，拉高門檻只會犧牲自己該接住的人。
  # TODO(W2)：語料切出來後用真實案例 500 筆 vs 非本類 500 筆重新校準。
  route_min: 0.45
  route_hint_min: 0.30
priority: 60

deliverables:
  m1: m1_corpus.py
  m2: m2_vision.py
  m3: m3_retrieval.py
  m4: m4_judgement.py
  m5: m5_agent.py
  playbook: playbook.yaml
  report: REPORT.md

stats:
