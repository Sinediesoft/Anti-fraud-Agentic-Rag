# 行動劇本（說明書 S14 第 4 點）—— 模組 D：超商物流假冒客服
#
# 三條規矩：
#   1. 每個階段都要有行動，高風險階段不得為空
#   2. 行動要具體到能執行（「立即撥打 165 並聯繫匯款銀行申請圈存」可以；「提高警覺」不行）
#   3. 🔴 第一條行動要跟其他四個模組明顯不同
#
# 為什麼我的第一條是「立刻停止操作」而不是「撥打 165」：
#   A／C／E 的使用者多半是事後才來的，所以他們第一條寫撥 165 是對的。
#   我的使用者不一樣 —— 他是**交易進行到一半、正被對方催著操作**的人。
#   語料實測 S3「認證失敗」這一步有 5,387 筆（47%），那時候他**還沒有損失**。
#   對他來說最有價值的第一句話是「停下來」，不是「打電話」——
#   打電話要等，而對方正在倒數。時間差就是這個模組的價值。
#
# 階段順序＝歷程順序。detect_stage() 取「有命中的階段裡走得最遠的那一個」，
# 所以順序不能亂排（受害者常把整段經過一次講完）。
#
# 每階段的筆數是 2026-09-21 對核心鏈語料 11,389 筆的實測（可複選，故加總 > 100%）。

stages:
  # ── S1　3,086 筆（27%）─────────────────────────────────────
  - id: asked_to_use_myship
    name: 剛被要求改用賣貨便交易
    risk: medium
    explanation: >-
      對方要你改用 7-11 賣貨便、全家好賣+ 這類超商店到店來交易。
      這一步本身是正常的，很多人真的用這個寄東西。真正要看的是下一步：
      官方流程到這裡為止，不會再要求你做任何「認證」或「簽署」。
    cues: [賣貨便, 好賣, 店到店, 超商, 寄貨, 交易, 下單, 賣場]
    actions:
      - text: >-
          先停下來，不要照對方給的步驟走。接下來如果出現「實名認證」或
          「金流簽署」，那一步在官方流程裡不存在。
        urgency: now
        why: >-
          刑事警察局 2026-05-17 公告防詐要點第三條明文：「賣貨便無需實名認證、
          金流簽署」。先知道這件事，後面就不會被話術帶著走。
      - text: >-
          不要點對方傳來的任何連結。要用賣貨便就自己開官方 App，
          或自己輸入 myship.7-11.com.tw 進去。
        urgency: now
        why: 偽冒網站做得高度仿真，官方網域常被拆成連字號塞進子網域。
      - text: 如果對方是用「免費送你東西、只要付運費」開場的，那是公告點名的誘餌。
        urgency: normal
        preventive: true

  # ── S2　6,712 筆（59%）─────────────────────────────────────
  - id: link_opened
    name: 已經點了連結或建了賣場
    risk: medium
    explanation: >-
      你已經在對方給的頁面上操作了。光是點開還不會損失金錢，
      現在停手代價最小。要小心的是那個頁面等一下會跳出什麼。
    cues: [點了, 連結, 網址, 建立賣場, 創賣場, 註冊, 填資料, 登入]
    actions:
      - text: >-
          立刻停止在那個頁面上輸入任何東西，特別是銀行帳號、信用卡號、
          身分證字號與手機收到的驗證碼。
        urgency: now
        why: 到目前為止你很可能還沒有損失，真正的損失從送出這些資料開始。
      - text: >-
          關掉那個頁面，改從官方 App 或自己輸入的官方網址重新進入，
          看看同一筆交易在官方那邊是什麼狀態。
        urgency: now
        why: 兩邊對照是最快分辨真假網站的方法，不需要任何專業知識。
      - text: 如果已經輸入過銀行或信用卡資料，現在就打銀行客服把卡片或網銀停用。
        urgency: today
        why: 資料外流後的止損時間以小時計。

  # ── S3　5,387 筆（47%）★核心話術 ───────────────────────────
  - id: verification_failed
    name: 被說「認證失敗」或「未完成金流簽署」
    risk: high
    explanation: >-
      這是整個詐騙的核心話術，也是你最該停下來的一刻。
      官方明文說過這道手續不存在 —— 所以看到這句話，不需要判斷對方是不是壞人，
      只要知道正常流程沒有這一步就夠了。
    cues: [認證失敗, 未完成, 實名, 實名制, 認證, 驗證, 金流簽署, 未開通, 帳號異常, 訂單凍結]
    actions:
      - text: >-
          立刻停止操作，你現在很可能還沒有損失。這一步是假的 —— 刑事警察局
          2026-05-17 公告寫明「賣貨便無需實名認證、金流簽署」。
        urgency: now
        why: >-
          這是本模組最重要的一句話。47% 的受害者在這一步就察覺不對，
          卻因為不確定「正常流程長什麼樣」而繼續照做。
      - text: >-
          不要匯任何錢去「解除限制」。真正的金流服務費是 2%／2.2%，由平台從
          撥款中直接扣除，從來不需要賣家先付錢。
        urgency: now
        why: 7-ELEVEN 賣貨便幫助中心（2024-12-01）載明撥款與費用規則。
      - text: >-
          如果要確認帳號真的有問題，自己打官方客服信箱 711ec@sp88.com，
          或自己加官方 LINE 查證，不要用對方給的任何聯絡方式。
        urgency: today
        why: 真客服不會主動用連結或 QR Code 請你加好友。

  # ── S4　4,004 筆（35%）─────────────────────────────────────
  - id: fake_agent_contacted
    name: 已經加了「客服」或「銀行專員」
    risk: high
    explanation: >-
      對方把你轉給一個「線上客服」，可能之後還會再轉「銀行專員」。
      語料實測假客服出現 92%、假銀行專員 17%。
      真客服不會加你 LINE，更不會跟你開視訊或要你分享螢幕。
    cues: [客服, 線上客服, 專員, 加賴, 加LINE, 視訊, 派對模式, 分享螢幕, 遠端]
    actions:
      - text: >-
          立刻停止跟他對話，先不要封鎖也不要刪除 —— 先把整段對話、
          對方帳號名稱與頭像截圖存下來。
        urgency: now
        why: 封鎖是本能反應，但證據會跟著不見。報案時這些是唯一能追的東西。
      - text: >-
          絕對不要開視訊、不要開 LINE 的「派對模式」分享螢幕、
          不要安裝他叫你裝的任何程式。
        urgency: now
        why: >-
          刑事警察局防詐要點第四條：真客服不會開視訊。分享螢幕等於把你的
          網銀畫面和簡訊驗證碼直接交出去。
      - text: >-
          如果同時有另一個人一直傳訊息說「你害我帳戶被凍結」「我小孩等著開刀」，
          那是同一組人的劇本，不要因為同情而加快動作。
        urgency: now
        why: >-
          刑事警察局公告明載這種同步情緒勒索，包含傳送假的家暴影片。
          它的目的就是讓你來不及思考。
      - text: 掛掉電話後，自己打 165 或自己查官方客服電話重新查證。
        urgency: today

  # ── S5　9,774 筆（86%）─────────────────────────────────────
  - id: money_sent
    name: 已經操作或已經轉帳
    risk: critical
    explanation: >-
      錢已經出去了。現在每一分鐘都在決定能不能攔下來。
      語料實測這一步佔 86% —— 大多數人是到這裡才來求助的。
      接下來兩件事最重要：讓銀行圈存，以及不要再匯第二筆。
    cues: [匯了, 轉帳了, 轉了, 匯款, 無卡提款, 提款, 掃碼, 付款碼, QR, 驗證碼, 寄卡, 金融卡]
    actions:
      - text: 立即撥打 165，並馬上打你匯出帳戶的銀行客服申請圈存與警示帳戶通報。
        urgency: now
        why: 圈存越早，還沒被車手提走的錢越有機會攔下來。
      - text: >-
          如果是超商物流的交易，24 小時內到賣貨便的「疑似詐騙案件申報」頁面
          填寫申訴止付。
        urgency: now
        why: >-
          7-ELEVEN 官方止付機制：取件完成後 24 小時內受理（週三或週日取件者
          最慢隔日 09:30 前），需附報案證明單，7 日內沒補件就會自動撥款給對方。
      - text: >-
          不要再匯任何一筆錢，包含對方說「再付一筆就能解凍」
          「補手續費才能退款」的那一筆。
        urgency: now
        why: 語料實測 9% 的人被要求匯第二筆。那是同一組人。
      - text: 保留所有對話紀錄、匯款單據、對方帳號與那個假網站的網址，不要刪除。
        urgency: today
        why: 報案與銀行止付都要這些。
      - text: 如果你拍過或傳過付款 QR Code、提供過簡訊驗證碼，一併告訴銀行。
        urgency: today
        why: 那等同於把付款授權交出去，銀行需要知道才能正確處置。

  # ── S6　1,061 筆（9%）──────────────────────────────────────
  - id: second_payment_requested
    name: 被要求匯第二筆（解凍金、退款手續費）
    risk: critical
    explanation: >-
      對方換了一個名目再要一次錢：解凍金、保證金、退款手續費、稅金。
      有時候會換一個自稱「協助辦理退款」的人來聯絡。那是同一組人。
      這一步是損失擴大的主因。
    cues: [第二筆, 再匯, 解凍, 解除, 保證金, 退款, 手續費, 稅金, 協助處理, 再一筆]
    actions:
      - text: >-
          不要匯。那筆「解凍金」是同一組人，匯出去不會讓前一筆回來，
          只會再損失一次。
        urgency: now
        why: 為了拿回已經損失的錢而再付一次，是這類詐騙金額擴大的最主要原因。
      - text: >-
          如果對方自稱是「警方」「檢察官」「銀行防詐中心」要協助你退款，
          掛掉電話，自己打 165 查證。
        urgency: now
        why: 真正的機關不會用電話要求你再做任何金流操作。
      - text: 把這一輪的對話也截圖存證，補進你先前的報案資料。
        urgency: today
        why: 第二波的帳號往往是不同人頭，對追查有幫助。

# 認不出階段時退到哪一階段。退到 S1 而不是 S5：
# 寧可少講一點，也不要嚇到一個其實還沒損失的人，而 S1 的行動對任何階段都無害。
fallback_stage: asked_to_use_myship
