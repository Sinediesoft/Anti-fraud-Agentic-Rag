# 20 題考題（說明書 S12 第 4 點、S14 第 3 點）—— 模組 D
#
# 每題寫成「受害者會怎麼講這件事」的白話查詢，至少 8 題完全不含專有名詞。
# 出題太簡單會讓分數虛高。整個專案的起點就是「群組裡的老師叫我先入金才能出金」
# 在官方站台 0 筆命中 —— 題目要逼近那個場景。
#
# 🔴 本模組出 plain 題特別重要。受害者在 S3「認證失敗」那一刻是被催著操作的，
#    他不會打「7-11 賣貨便假冒客服」，他會打「他說我要認證才能收錢」。
#    所以這裡 12 題 plain（超過門檻的 8 題），刻意把難度壓在真實語境上。
#
# 欄位：
#   text          白話查詢
#   gold_case_ids 正確答案的案例編號（S10 標的那 60 筆裡挑）
#   plain         true 表示完全不含專有名詞
#
# TODO(W3)：gold_case_ids 目前全空，要等 M1 切出語料、S10 標完 60 筆才能填。
#           沒有它就只能評「認不認得出是我的案子」，不能評 Recall@5。

