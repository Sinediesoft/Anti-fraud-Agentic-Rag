<svg xmlns="http://www.w3.org/2000/svg" width="680" height="566" viewBox="0 0 680 566" role="img">
<title>防詐 Copilot 系統分層與 RAG 元件（現況，2026-09-23）</title>
<desc>由上到下分成外殼、模組、共用層與本機資料，標出已經在跑與尚未實作的部分。</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
.bg{fill:#FFFFFF}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.box{fill:#FFFFFF;stroke:#B4B2A9;stroke-width:0.8}
.dash{stroke-dasharray:4 3}
.arr{fill:none;stroke:#888780;stroke-width:1.5}
.head{fill:none;stroke:#888780}
.c-gray>rect{fill:#F1EFE8;stroke:#B4B2A9;stroke-width:0.8}
.c-gray>.th{fill:#444441}
.c-gray>.ts{fill:#5F5E5A}
.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.8}
.c-teal>.th{fill:#085041}
.c-teal>.ts{fill:#0F6E56}
@media (prefers-color-scheme:dark){
.bg{fill:#1C1C1B}
.th{fill:#F1EFE8}
.ts{fill:#B4B2A9}
.box{fill:#1C1C1B;stroke:#888780}
.arr,.head{stroke:#B4B2A9}
.c-gray>rect{fill:#262624;stroke:#5F5E5A}
.c-gray>.th{fill:#D3D1C7}
.c-gray>.ts{fill:#B4B2A9}
.c-teal>rect,rect.c-teal{fill:#085041;stroke:#5DCAA5}
.c-teal>.th{fill:#9FE1CB}
.c-teal>.ts{fill:#5DCAA5}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head" d="M2 1L8 5L2 9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" width="680" height="566" rx="12"/>
<g class="c-gray"><rect x="40" y="30" width="600" height="116" rx="16"/><text class="th" x="60" y="52" dominant-baseline="central">外殼 app/</text><text class="ts" x="140" y="52" dominant-baseline="central">不懂詐騙，只負責比大小</text></g>
<g class="c-teal"><rect x="60" y="68" width="125" height="56" rx="8"/><text class="th" x="122.5" y="86" text-anchor="middle" dominant-baseline="central">對話層</text><text class="ts" x="122.5" y="108" text-anchor="middle" dominant-baseline="central">追問三輪</text></g>
<g class="c-teal"><rect x="205" y="68" width="125" height="56" rx="8"/><text class="th" x="267.5" y="86" text-anchor="middle" dominant-baseline="central">路由</text><text class="ts" x="267.5" y="108" text-anchor="middle" dominant-baseline="central">比 can_handle</text></g>
<g class="c-teal"><rect x="350" y="68" width="125" height="56" rx="8"/><text class="th" x="412.5" y="86" text-anchor="middle" dominant-baseline="central">解鎖</text><text class="ts" x="412.5" y="108" text-anchor="middle" dominant-baseline="central">免費版只開 A</text></g>
<g class="c-teal"><rect x="495" y="68" width="125" height="56" rx="8"/><text class="th" x="557.5" y="86" text-anchor="middle" dominant-baseline="central">輸出檢核</text><text class="ts" x="557.5" y="108" text-anchor="middle" dominant-baseline="central">擋下或修補</text></g>
<line x1="340" y1="148" x2="340" y2="174" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="40" y="182" width="600" height="114" rx="16"/><text class="th" x="60" y="204" dominant-baseline="central">模組 packages/modules/</text><text class="ts" x="236" y="204" dominant-baseline="central">五人各寫一套，B、D 尚未建立</text></g>
<g class="c-teal"><rect x="60" y="220" width="172" height="56" rx="8"/><text class="th" x="146" y="238" text-anchor="middle" dominant-baseline="central">A　LINE × 假投資</text><text class="ts" x="146" y="260" text-anchor="middle" dominant-baseline="central">向量檢索＋規則判讀</text></g>
<g class="c-teal"><rect x="254" y="220" width="172" height="56" rx="8"/><text class="th" x="340" y="238" text-anchor="middle" dominant-baseline="central">C　FB × 投資</text><text class="ts" x="340" y="260" text-anchor="middle" dominant-baseline="central">向量檢索＋模型生成</text></g>
<g class="c-teal"><rect x="448" y="220" width="172" height="56" rx="8"/><text class="th" x="534" y="238" text-anchor="middle" dominant-baseline="central">E　Threads × 網購</text><text class="ts" x="534" y="260" text-anchor="middle" dominant-baseline="central">字元比對＋規則判讀</text></g>
<line x1="220" y1="298" x2="220" y2="324" class="arr" marker-end="url(#arrow)"/>
<line x1="528" y1="298" x2="528" y2="324" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="40" y="332" width="360" height="182" rx="16"/><text class="th" x="60" y="354" dominant-baseline="central">共用層 shared/</text><text class="ts" x="176" y="354" dominant-baseline="central">模型呼叫只准走這裡</text></g>
<g class="c-teal"><rect x="60" y="370" width="150" height="56" rx="8"/><text class="th" x="135" y="388" text-anchor="middle" dominant-baseline="central">去識別化</text><text class="ts" x="135" y="410" text-anchor="middle" dominant-baseline="central">deid.mask()</text></g>
<g class="c-teal"><rect x="230" y="370" width="150" height="56" rx="8"/><text class="th" x="305" y="388" text-anchor="middle" dominant-baseline="central">嵌入 bge-m3</text><text class="ts" x="305" y="410" text-anchor="middle" dominant-baseline="central">embed()・CPU fp32</text></g>
<g class="c-teal"><rect x="60" y="438" width="150" height="56" rx="8"/><text class="th" x="135" y="456" text-anchor="middle" dominant-baseline="central">地端小模型</text><text class="ts" x="135" y="478" text-anchor="middle" dominant-baseline="central">qwen2.5:3b・Ollama</text></g>
<g><rect class="box dash" x="230" y="438" width="150" height="56" rx="8"/><text class="th" x="305" y="456" text-anchor="middle" dominant-baseline="central">重排序 rerank()</text><text class="ts" x="305" y="478" text-anchor="middle" dominant-baseline="central">尚未實作</text></g>
<g class="c-gray"><rect x="416" y="332" width="224" height="182" rx="16"/><text class="th" x="436" y="354" dominant-baseline="central">本機資料</text><text class="ts" x="506" y="354" dominant-baseline="central">不進版控</text></g>
<g><rect class="box" x="436" y="370" width="184" height="56" rx="8"/><text class="th" x="528" y="388" text-anchor="middle" dominant-baseline="central">165 全量語料</text><text class="ts" x="528" y="410" text-anchor="middle" dominant-baseline="central">194,355 筆 parquet</text></g>
<g><rect class="box" x="436" y="438" width="184" height="56" rx="8"/><text class="th" x="528" y="456" text-anchor="middle" dominant-baseline="central">各模組切出的語料</text><text class="ts" x="528" y="478" text-anchor="middle" dominant-baseline="central">cases.jsonl＋向量索引</text></g>
<rect x="40" y="534" width="12" height="12" rx="2" class="c-teal"/><text class="ts" x="58" y="540" dominant-baseline="central">已在跑的程式</text>
<rect x="160" y="534" width="12" height="12" rx="2" class="box dash"/><text class="ts" x="178" y="540" dominant-baseline="central">尚未實作</text>
<rect x="254" y="534" width="12" height="12" rx="2" class="box"/><text class="ts" x="272" y="540" dominant-baseline="central">資料</text>
</svg>
