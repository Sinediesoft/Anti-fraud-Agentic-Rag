<svg xmlns="http://www.w3.org/2000/svg" width="680" height="616" viewBox="0 0 680 616" role="img">
<title>使用者輸入文字後的處理流程（現況，2026-09-24）</title>
<desc>從使用者輸入、對話層追問、路由比分、只交給分數最高的一個模組判讀、輸出檢核到呈現，含尚未涵蓋與未解鎖兩條分支。</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
.bg{fill:#FFFFFF}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.box{fill:#FFFFFF;stroke:#B4B2A9;stroke-width:0.8}
.arr{fill:none;stroke:#888780;stroke-width:1.5}
.head{fill:none;stroke:#888780}
.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.8}
.c-teal>.th{fill:#085041}
.c-teal>.ts{fill:#0F6E56}
.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.8}
.c-purple>.th{fill:#3C3489}
.c-purple>.ts{fill:#534AB7}
@media (prefers-color-scheme:dark){
.bg{fill:#1C1C1B}
.th{fill:#F1EFE8}
.ts{fill:#B4B2A9}
.box{fill:#1C1C1B;stroke:#888780}
.arr,.head{stroke:#B4B2A9}
.c-teal>rect,rect.c-teal{fill:#085041;stroke:#5DCAA5}
.c-teal>.th{fill:#9FE1CB}
.c-teal>.ts{fill:#5DCAA5}
.c-purple>rect,rect.c-purple{fill:#3C3489;stroke:#AFA9EC}
.c-purple>.th{fill:#CECBF6}
.c-purple>.ts{fill:#AFA9EC}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head" d="M2 1L8 5L2 9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" width="680" height="616" rx="12"/>
<g><rect class="box" x="48" y="40" width="300" height="56" rx="8"/><text class="th" x="198" y="58" text-anchor="middle" dominant-baseline="central">使用者輸入</text><text class="ts" x="198" y="80" text-anchor="middle" dominant-baseline="central">打字，可以附截圖</text></g>
<line x1="198" y1="96" x2="198" y2="124" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="48" y="132" width="300" height="56" rx="8"/><text class="th" x="198" y="150" text-anchor="middle" dominant-baseline="central">對話層：累積每一輪的話</text><text class="ts" x="198" y="172" text-anchor="middle" dominant-baseline="central">偵測到出事，先給停損三條與 165</text></g>
<line x1="348" y1="160" x2="384" y2="160" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="392" y="132" width="220" height="56" rx="8"/><text class="th" x="502" y="150" text-anchor="middle" dominant-baseline="central">還沒問滿三題：再問一題</text><text class="ts" x="502" y="172" text-anchor="middle" dominant-baseline="central">↻ 回到使用者輸入</text></g>
<text class="ts" x="210" y="206" dominant-baseline="central">問滿三題，或按「直接看結果」</text>
<line x1="198" y1="188" x2="198" y2="216" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="48" y="224" width="300" height="56" rx="8"/><text class="th" x="198" y="242" text-anchor="middle" dominant-baseline="central">路由：每個模組自己打分</text><text class="ts" x="198" y="264" text-anchor="middle" dominant-baseline="central">can_handle() 過 route_min 才算認領</text></g>
<line x1="348" y1="252" x2="384" y2="252" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="392" y="224" width="220" height="56" rx="8"/><text class="th" x="502" y="242" text-anchor="middle" dominant-baseline="central">沒有模組過門檻</text><text class="ts" x="502" y="264" text-anchor="middle" dominant-baseline="central">標為尚未涵蓋，給通用建議</text></g>
<text class="ts" x="210" y="298" dominant-baseline="central">有模組認領</text>
<line x1="198" y1="280" x2="198" y2="308" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="48" y="316" width="300" height="56" rx="8"/><text class="th" x="198" y="334" text-anchor="middle" dominant-baseline="central">分數最高的那個模組判讀</text><text class="ts" x="198" y="356" text-anchor="middle" dominant-baseline="central">其他認領的只給提醒；先過解鎖檢查</text></g>
<line x1="348" y1="344" x2="384" y2="344" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="392" y="316" width="220" height="56" rx="8"/><text class="th" x="502" y="334" text-anchor="middle" dominant-baseline="central">模組未解鎖</text><text class="ts" x="502" y="356" text-anchor="middle" dominant-baseline="central">只說類型；風險與 165 照給</text></g>
<line x1="198" y1="372" x2="198" y2="400" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="48" y="408" width="300" height="56" rx="8"/><text class="th" x="198" y="426" text-anchor="middle" dominant-baseline="central">輸出檢核 guards</text><text class="ts" x="198" y="448" text-anchor="middle" dominant-baseline="central">高風險沒行動就改給通用建議</text></g>
<line x1="198" y1="464" x2="198" y2="492" class="arr" marker-end="url(#arrow)"/>
<g><rect class="box" x="48" y="500" width="300" height="56" rx="8"/><text class="th" x="198" y="518" text-anchor="middle" dominant-baseline="central">呈現給使用者</text><text class="ts" x="198" y="540" text-anchor="middle" dominant-baseline="central">一份判讀、其他模組列成提醒、附免責聲明</text></g>
<path d="M502 372 L502 512 L356 512" class="arr" marker-end="url(#arrow)"/>
<path d="M612 252 L632 252 L632 530 L356 530" class="arr" marker-end="url(#arrow)"/>
<rect x="48" y="584" width="12" height="12" rx="2" class="c-teal"/><text class="ts" x="66" y="590" dominant-baseline="central">外殼（app/）</text>
<rect x="176" y="584" width="12" height="12" rx="2" class="c-purple"/><text class="ts" x="194" y="590" dominant-baseline="central">模組（各自實作）</text>
<rect x="322" y="584" width="12" height="12" rx="2" class="box"/><text class="ts" x="340" y="590" dominant-baseline="central">起點與結果</text>
</svg>
