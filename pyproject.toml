[project]
name = "anti-fraud-copilot"
version = "0.1.0"
description = "防詐 Copilot：語意理解受害者敘述與截圖，判定詐騙類型、階段與行動劇本"
requires-python = ">=3.11,<3.12"

# 底層依賴刻意保持最小。重的東西（OCR、向量庫、模型執行）都放在 optional
# extras 裡，因為說明書 S3 / S11 / S12 讓每個人自己選，不是全隊統一裝。
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# make install 會裝這組
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pre-commit>=3.7",
]
# 外殼介面（S7）
ui = [
    "streamlit>=1.35",
]
# 語料處理（S6 / S9）
data = [
    "polars>=1.0",
    "httpx>=0.27",
    "pyarrow>=16.0",
]
# 模型執行（S3 已鎖定嵌入模型後補上）。預設不裝，make install 不會帶到它 ——
# 只有要建向量庫或跑第一層檢索的人需要。
#
# 🔴 torch 刻意不鎖版本：macOS ARM 裝的是 CPU/MPS 版、Windows 要的是 CUDA 版，
#    wheel 來源本來就不同，在這裡寫死一個版本會讓其中一邊直接裝不起來。
#    真要統一到同一個 wheel，得用 [tool.uv.sources] 加平台 marker，不是改這行。
# 跨平台注意：嵌入與重排序固定 device="cpu"、dtype=float32（見 shared/models.py
#             的 EMBED_DEVICE / EMBED_DTYPE），否則 Mac(MPS/fp16) 與
#             Windows(CUDA/fp32) 算出來的向量不同、分數不能比。
#             地端 SLM 走原生 Ollama，不列在這裡。
ml = [
    "torch",
    "transformers>=4.44",
    "sentencepiece>=0.2",  # bge-m3 是 XLM-RoBERTa 底，tokenizer 要它
]
# TODO(S11)：OCR 引擎由各自比較後選定，但必須 macOS 與 Windows 都裝得起來
#            —— 實務上就是 RapidOCR。PaddleOCR 在 Apple Silicon 常裝不起來。
#            OpenCV 請用 opencv-python-headless，一般版在 CI(Linux) 需要 libGL 會失敗。
ocr = []
# TODO(S12)：向量庫由各自選定（Chroma / Qdrant）
rag = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "app",
    "packages/contracts",
    "packages/shared",
    "packages/modules",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "packages"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
