[project]
name = "anti-fraud-copilot"
version = "0.1.0"
description = "防詐 Copilot：語意理解受害者敘述與截圖，判定詐騙類型、階段與行動劇本"
requires-python = ">=3.11,<3.12"

# 底層依賴刻意保持最小。重的東西（OCR、向量庫、模型執行）都放在 optional
# extras 裡，因為說明書 S3 / S11 / S12 讓每個人自己選，不是全隊統一裝。
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# make install 會裝這組
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pre-commit>=3.7",
]
# 外殼介面（S7）
ui = [
    "streamlit>=1.35",
]
# 語料處理（S6 / S9）
data = [
    "polars>=1.0",
    "httpx>=0.27",
    "pyarrow>=16.0",
]
# TODO(S3)：模型鎖定後補上 sentence-transformers / ollama 等
ml = []
# TODO(S11)：OCR 引擎由各自比較後選定（RapidOCR / PaddleOCR / Tesseract）
ocr = []
# TODO(S12)：向量庫由各自選定（Chroma / Qdrant）
rag = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "app",
    "packages/contracts",
    "packages/shared",
    "packages/modules",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "packages"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
